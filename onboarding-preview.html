<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Turbo">
<title>Turbo-Onboarding</title>
<meta name="theme-color" content="#0b1a22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;500;600;700&display=swap">
<style>
/* Layout: Arbeits-App – Sidebar mit 4 Phasen / 9 Schritten links, Arbeitsfläche rechts; mobil Top-Bar + Modul-Drawer + Weiter-Leiste */
:root{
  --bg:#0b1a22; --panel:#11252e; --panel2:#17313c; --line:#24434f;
  --fg:#e9f2f4; --muted:#8ea6ae; --teal:#48bdc8; --teal-d:#289bad; --gold:#d9b45c;
  --ok:#5fcf9a; --warn:#e3a54c; --bad:#e07a6f;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Poppins","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--teal)}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:1.02;letter-spacing:.01em;text-transform:uppercase}
h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
h3{font-size:16px;font-weight:600}
p{margin:0}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tab{font-variant-numeric:tabular-nums}

/* App shell */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .p{color:var(--teal)}.brand .sep{color:var(--muted);padding:0 4px}.brand .t{color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.me{display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}.ring .fgc{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring text{fill:var(--fg);font:600 13px var(--body)}
.phase{display:flex;flex-direction:column;gap:2px}
.phase-h{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 8px 4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px;cursor:pointer;color:var(--fg);font-size:14px}
.nav:hover{background:var(--panel2)}
.nav.on{background:var(--panel2);box-shadow:inset 3px 0 0 var(--teal)}
.dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#0b1a22}
.dot.auto{border-color:var(--gold);color:var(--gold)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}

.main{min-width:0;padding-block:28px 110px;padding-inline:clamp(16px,4vw,48px)}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:none}

/* Elements */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.card.hi{border-color:var(--teal-d);background:linear-gradient(160deg,#143843,#11252e)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lead{font-size:16px;color:var(--muted);max-width:62ch}
.task{border-left:3px solid var(--gold);background:#1a2b2a;border-radius:0 10px 10px 0;padding:14px 16px}
.task b{color:var(--gold);letter-spacing:.08em;font-size:12px;text-transform:uppercase;display:block;margin-bottom:3px}
.quote{font-family:var(--display);font-size:22px;line-height:1.2;text-transform:uppercase;letter-spacing:.01em;color:var(--fg)}
.quote small{display:block;font-family:var(--body);text-transform:none;font-size:14px;color:var(--muted);margin-top:6px;letter-spacing:0}
.label{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
ul.clean{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.clean li{padding-left:16px;position:relative}
ul.clean li:before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--teal)}
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
ul.checks li{display:flex;align-items:center;gap:10px;color:var(--muted)}
ul.checks li.ok{color:var(--fg)}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:500;font-size:14px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#08161c;font-weight:600}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405;font-weight:600}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;background:var(--panel2);cursor:pointer}
.pill.on{background:var(--teal);color:#08161c;border-color:var(--teal)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;letter-spacing:.04em}
.b-ok{background:rgba(95,207,154,.15);color:var(--ok)}
.b-warn{background:rgba(227,165,76,.15);color:var(--warn)}
.b-mut{background:var(--panel2);color:var(--muted)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{padding:6px 8px}

.stars{display:inline-flex;gap:3px}
.stars button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:12px;color:var(--muted)}
.stars button.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}

.flow{display:flex;gap:8px;flex-wrap:wrap}
.flow span{flex:1 1 120px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:10px 6px;font-weight:600;font-size:13px;background:var(--panel)}

.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--gold)}
.kpi span{font-size:12px;color:var(--muted)}

.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .3s}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.chip.on{background:var(--teal);border-color:var(--teal);color:#06121f;font-weight:600}
.vktoggle{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;color:var(--fg);text-align:left;cursor:pointer;font-family:inherit}
.vkbox{border-color:rgba(217,180,92,.45)}
.vkbox>.card{background:transparent;border:0;padding:0}
.script{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.script .t{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.script p{font-size:14.5px}
.script mark{background:rgba(217,180,92,.18);color:var(--gold);border-radius:3px;padding:0 3px}

.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.opt.sel{border-color:var(--teal)}
.opt.right{border-color:var(--ok);background:rgba(95,207,154,.08)}
.opt.wrong{border-color:var(--bad);background:rgba(224,122,111,.08)}

.timer{font-family:var(--display);font-size:72px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.timer.run{color:var(--teal)}.timer.over{color:var(--bad)}

.vbox{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#06121a;border:1px solid var(--line)}
.vbox.tall{aspect-ratio:9/16;width:100%;max-width:260px;margin:0 auto}
.vbox iframe,.vbox video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.vplay{position:absolute;inset:0;width:100%;border:0;cursor:pointer;color:var(--fg);background:radial-gradient(circle at 70% 20%,rgba(72,189,200,.22),transparent 60%),#0d222b center/cover no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.vplay:before{content:"";position:absolute;inset:0;background:rgba(11,26,34,.45)}
.vbtn{position:relative;width:72px;height:72px;border-radius:50%;background:var(--gold);color:#1a1405;display:grid;place-items:center;font-size:26px;padding-left:4px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.vlbl{position:relative;font-weight:600;font-size:14px;letter-spacing:.04em}
.vplay:hover .vbtn{transform:scale(1.06)}
.planimg{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000}
.planimg img{display:block;width:100%;height:auto}
.more{border:1px dashed var(--teal-d);border-radius:10px;background:rgba(72,189,200,.06)}
.more>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--fg)}
.more>summary::-webkit-details-marker{display:none}
.more>summary:before{content:"＋";display:grid;place-items:center;width:22px;height:22px;flex:none;border-radius:50%;background:var(--teal);color:#08161c;font-size:13px;font-weight:700}
.more[open]>summary:before{content:"−"}
.more-t{flex:1;min-width:0}
.more-b{padding:0 14px 14px}
.more.danger{border-color:rgba(224,122,111,.5);background:rgba(224,122,111,.05)}
.more.danger>summary{color:var(--bad)}
.more.danger>summary:before{background:var(--bad)}
.more-hint{font-size:12px;font-weight:500;color:var(--teal);white-space:nowrap}
.more.danger .more-hint{color:var(--bad)}
.more-hint .h-c,.more[open] .more-hint .h-o,.vkhint.open .h-o{display:none}
.more[open] .more-hint .h-c,.vkhint.open .h-c{display:inline}
.more-chev{font-size:22px;line-height:1;color:var(--gold);transition:transform .2s;flex:none}
.more[open] .more-chev,.vkhint.open .more-chev{transform:rotate(90deg)}
.vkhint{display:flex;align-items:center;gap:8px;flex:none;border:1px solid rgba(217,180,92,.5);border-radius:999px;padding:5px 12px}
.vkhint .more-hint{color:var(--gold)}
@media (max-width:860px){.more-hint{font-size:11px}.vktoggle{flex-direction:column;align-items:flex-start}.vkhint{padding:4px 10px}}
.testbar{border:1px dashed var(--gold);background:rgba(217,180,92,.1);color:var(--fg);border-radius:10px;padding:9px 14px;font-size:13px}
.testbar b{color:var(--gold);letter-spacing:.1em;margin-right:6px}
.pace{text-align:left;cursor:pointer}
.pace.on{border-color:var(--gold);background:linear-gradient(160deg,#2a2614,#11252e)}
.pace.on h3{color:var(--gold)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,180,92,.55)}50%{box-shadow:0 0 0 6px rgba(217,180,92,0)}}
.na-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.na-sum>div{display:flex;flex-direction:column;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
input[type=datetime-local]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;color:inherit}
.avail{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.avail.now{border-color:rgba(95,207,154,.45)}.avail.now b{color:var(--ok)}
.avail.plan{border-color:rgba(227,165,76,.5)}.avail.plan b{color:var(--warn)}
.qrow{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.yn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ok);cursor:pointer;font-weight:700}
.yn.on{border-color:var(--ok);background:rgba(95,207,154,.15)}
table.pick td,table.pick th{text-align:center}table.pick td:first-child,table.pick th:first-child{text-align:left}
.linkbtn{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.nav.opt{opacity:.62}
.field small{font-size:12px}
.modfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}
.c-lesson,.c-calculator{min-width:0}
.c-controls .btn,.c-controls .pill{min-height:44px}
.c-lesson .opt{min-height:44px}
.c-calculator .kpi b{font-size:clamp(22px,4vw,34px);overflow-wrap:anywhere}
.c-source{border-left:3px solid var(--teal)}
.c-presets button{text-align:left;color:var(--fg);font:inherit}
.print-summary{display:none}
@media print{
 .print-summary{display:block!important}
 .c-lesson,.c-calculator,.cert,.print-summary{break-inside:avoid}
}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gold);color:#1a1405;padding:9px 16px;border-radius:9px;font-weight:600;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.4)}

.listrow{display:grid;grid-template-columns:34px minmax(0,1.2fr) minmax(0,1.4fr) 140px 34px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.listrow .n{color:var(--muted);font-size:12px}
.iconbtn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--bad);border-color:var(--bad)}

.cert{border:2px solid var(--gold);border-radius:16px;padding:32px;background:radial-gradient(circle at 85% 10%,rgba(72,189,200,.16),transparent 55%),var(--panel);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.cert .lv{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cert .lv span{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.cert .lv span.on{border-color:var(--gold);color:var(--gold)}

.welcome{max-width:760px;margin:0 auto;padding-block:clamp(28px,7vh,80px) 60px;padding-inline:16px;display:flex;flex-direction:column;gap:26px}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.steps4 div{padding:14px 12px;border-right:1px solid var(--line)}
.steps4 div:last-child{border-right:0}
.steps4 b{display:block;font-size:12px;letter-spacing:.08em;color:var(--teal)}
.steps4 span{font-size:13px;color:var(--muted)}

.langs{display:flex;flex-wrap:wrap;gap:4px}
.langs button{border:1px solid var(--line);background:none;border-radius:6px;padding:3px 7px;font-size:11px;font-weight:600;letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.langs button.on{background:var(--teal);border-color:var(--teal);color:#08161c}
.topbar .langsel{width:auto;padding:5px 8px;font-size:13px}
.mobnav{display:none}
.overlay{display:none}

@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);z-index:50;transform:translateX(-105%);transition:transform .25s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
  .main{padding-block:20px 110px}
  .grid2,.grid3,.grid4,.steps4{grid-template-columns:minmax(0,1fr)}
  .steps4 div{border-right:0;border-bottom:1px solid var(--line)}
  .listrow{grid-template-columns:28px minmax(0,1fr) 34px;row-gap:6px}
  .listrow .ctx,.listrow .cat{grid-column:2 / 3}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));gap:10px}
  .mobnav .btn{flex:1}
  .timer{font-size:56px}
}
/*@@THEME_START@@*/
/* Heller Modus (nur Testversion/Vorschau setzt data-theme): Elfenbein + Navy + Gold, gleiche Markenlogik wie dunkel */
:root[data-theme="light"]{
  --bg:#f5f1e8; --panel:#ffffff; --panel2:#efe9dc; --line:#dcd3c1;
  --fg:#0b1a22; --muted:#55666d; --teal:#17808c; --teal-d:#126c77; --gold:#b08526;
  --ok:#23885a; --warn:#a96a12; --bad:#b9443a;
  color-scheme:light;
}
:root[data-theme="light"] body{background:radial-gradient(1200px 500px at 85% -10%,rgba(176,133,38,.10),transparent 60%),var(--bg)}
:root[data-theme="light"] .side{background:#0b1a22;color:#e9f2f4;border-right:0;--panel:#11252e;--fg:#e9f2f4;--muted:#9fb4bb;--panel2:#17313c;--line:#2a4a56;--teal:#48bdc8;--gold:#d9b45c}
:root[data-theme="light"] .side .nav{color:#e9f2f4}
:root[data-theme="light"] .card{box-shadow:0 1px 2px rgba(11,26,34,.05),0 6px 18px rgba(11,26,34,.05)}
:root[data-theme="light"] .card.hi{background:linear-gradient(160deg,#ffffff,#f3ecdb);border-color:var(--gold)}
:root[data-theme="light"] .task{background:#fbf6ea}
:root[data-theme="light"] .pace.on{background:linear-gradient(160deg,#fbf3df,#ffffff)}
:root[data-theme="light"] .btn.pri,:root[data-theme="light"] .pill.on,:root[data-theme="light"] .langs button.on,:root[data-theme="light"] .more>summary:before{color:#ffffff}
:root[data-theme="light"] .btn.gold,:root[data-theme="light"] .toast,:root[data-theme="light"] .vbtn{color:#1a1405;background:#d9b45c;border-color:#c9a245}
:root[data-theme="light"] .dot.done{color:#ffffff}
:root[data-theme="light"] .topbar{background:#0b1a22;color:#e9f2f4;--fg:#e9f2f4;--muted:#9fb4bb;--line:#2a4a56;--panel:#11252e}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:#ffffff}
:root[data-theme="light"] .testbar{background:rgba(176,133,38,.10)}

scripts:{
 an:[["Freunde · locker","Hey [Name], ich hab mir nebenbei was Neues aufgebaut und will’s dir unbedingt zeigen, weil deine ehrliche Meinung mir wichtig ist. Keine Sorge, ich will dir nichts andrehen. Hast du die Tage mal 15 Minuten, gern auch bei einem Kaffee?","fr"],
  ["Freunde · sachlich","Hi [Name], ich starte gerade ein Projekt neben meinem Job und würde gern hören, wie du das einschätzt. Du sagst mir ja immer direkt, was du denkst. Wann passt dir ein kurzes Treffen?","fr"],
  ["Bekannte · locker","Hey [Name], lang nichts gehört! Ich bin gerade bei einem neuen Thema dabei, und irgendwie musste ich dabei an dich denken. Magst du mal kurz telefonieren?","be"],
  ["Bekannte · sachlich","Hallo [Name], ich habe vor Kurzem etwas Neues gestartet, das für dich oder dein Umfeld interessant sein könnte. Ich erkläre es lieber kurz am Telefon als lang im Chat. Passt dir diese Woche?","be"],
  ["Warmer Kontakt · locker","Hi [Name], du bist doch jemand, der viele Leute kennt und offen für Neues ist. Ich hab gerade was am Start, wo genau so jemand gefragt ist. Lust auf 10 Minuten?","wa"],
  ["Warmer Kontakt · sachlich","Hallo [Name], ich baue gerade nebenberuflich etwas auf und suche Menschen, die gut vernetzt sind und gern etwas bewegen. Du bist mir sofort eingefallen. Hättest du kurz Zeit für einen Austausch?","wa"],
  ["Kalter Kontakt · locker","Hey [Name], ich hab gesehen, dass du [konkreter Bezug: Post, Beruf, Gruppe]. Find ich stark! Ich bin selbst gerade an etwas dran, das gut dazu passen könnte. Darf ich dir mal kurz erzählen, worum’s geht?","ka"],
  ["Kalter Kontakt · sachlich","Hallo [Name], ich bin über [Bezug] auf dich gestoßen. Ich suche gerade Menschen, die unternehmerisch denken, für ein Projekt im Aufbau. Wenn du grundsätzlich offen bist, zeige ich dir die Idee in 10 Minuten. Wenn nicht, ist das auch völlig okay.","ka"],
  ["Alter Kontakt · Nachricht 1","Hey [Name], ich war ehrlich gesagt ewig nicht mehr bei dir gemeldet, aber ich musste neulich an dich denken. Wie läuft’s bei dir?","re"],
  ["Alter Kontakt · Nachricht 2 (nach Antwort)","Schön, von dir zu hören! Bei mir tut sich gerade auch einiges, ich hab was Neues gestartet. Erzähl ich dir gern mal in Ruhe. Magst du die Tage kurz telefonieren?","re"]],
 vk:[["1 · Augenhöhe (Standard)","Servus [Name], du hast über Jahre etwas aufgebaut, das die meisten nie schaffen: Menschen, Reichweite und Vertrauen. Mich beschäftigt eine Frage: Warum arbeitet so eine Struktur wirtschaftlich nur für ein einziges Geschäftsmodell? Wir haben dazu einen Ansatz, der dein Kerngeschäft ergänzt und nichts davon ersetzt oder abzieht. Hast du nächste Woche 15 Minuten?"],
  ["2 · Unternehmer / Geschäftsführer","Servus [Name], eine unternehmerische Frage an dich: Der eigentliche Wert deiner Organisation steckt in den Menschen und Beziehungen, aber monetarisiert wird meist nur das Kernprodukt. Genau an dieser Lücke setzen wir an, als zusätzliches Ertragsfeld für die Organisation und ihre Partner. Ich würde das gern mit dir als Unternehmer durchspielen. Passt dir Dienstag oder Donnerstag für 20 Minuten?"],
  ["3 · Kurz für Vielbeschäftigte","Servus [Name], kurze Frage: Was wäre, wenn deine Struktur eine zusätzliche Einnahmequelle erschließt, ohne dass sich an deinem Geschäft etwas ändert? Daran arbeiten wir gerade. 15 Minuten in den nächsten Tagen?"],
  ["4 · Über Empfehlung","Servus [Name], [Kontaktperson] hat mir geraten, dich direkt anzusprechen. Ich verantworte bei uns den strategischen Aufbau mit bestehenden Vertriebsorganisationen. Uns geht es nicht um Abwerbung, sondern darum, Netzwerke so zu verbinden, dass beide Seiten wirtschaftlich davon profitieren. Wie sieht es bei dir nächste Woche für ein kurzes Telefonat aus?"],
  ["5 · Provokant (nur bei Bekannten)","Servus [Name], deine Leute sind da, dein Netzwerk ist da, das Vertrauen ist da. Warum arbeitet das alles nur für ein Geschäftsmodell? Ich habe dazu einen Ansatz, den ich gern mit dir durchspiele. Über einen klassischen Vertrieb reden wir dabei nicht. Bist du nächste Woche für 20 Minuten offen?"],
  ["6 · Vertriebsinhaber (Partnerbindung)","Servus [Name], du investierst laufend in Menschen, Führung und Ausbildung, und trotzdem hängt deren Einkommen meist an einem einzigen Produkt. Wir haben einen Ansatz, der deinen Partnern ein zusätzliches Ertragsfeld gibt, innerhalb deiner Organisation. Damit hätten sie einen Grund mehr, bei dir zu bleiben. Lass uns das in 15 Minuten prüfen. Wann passt es dir?"],
  ["Follow-up · nach 3–5 Tagen","Servus [Name], ich hake einmal kurz nach. Ist das Thema grundsätzlich interessant, später wieder relevant oder passt es nicht? Alle drei Antworten sind völlig okay."],
  ["Abschluss · nach weiteren 7 Tagen","Servus [Name], ich nehme das Thema auf meiner Seite raus, damit nichts offen herumliegt. Falls du den Gedanken später prüfen willst, melde dich jederzeit. Weiter viel Erfolg mit deinem Team!"],
  ["Wenn Interesse kommt","Sehr gern! Damit du es richtig einordnen kannst: Ich will dir im Gespräch nicht einfach etwas präsentieren. Zuerst möchte ich verstehen, wie deine Struktur aufgestellt ist, und dann zeige ich dir, wo wir konkret ansetzen könnten. Dann siehst du schnell, ob es passt. [Tag] um [Uhrzeit]?"],
  ["Einwand · „Worum geht’s genau?“","Ehrlich gesagt würde ich es im Chat verkürzt und damit falsch erklären. In 15 Minuten siehst du selbst, ob es zu dir passt. [Tag] oder [Tag]?"]],
 fu:[["Nach einem guten Erstgespräch","Danke dir für den Austausch. Für mich sind vor allem [Punkt 1] und [Punkt 2] interessant. Lass uns als nächsten Schritt [konkrete Aktion] machen. Passt dir [Tag/Uhrzeit]?"],["Keine Rückmeldung","Hi [Name], ich hake einmal sauber nach, damit das Thema nicht irgendwo im Chat hängen bleibt. Ist das aktuell grundsätzlich interessant, sollen wir es später wieder aufnehmen oder passt es für dich nicht? Alles drei ist völlig okay."],["Noch unsicher","Was ist aktuell der eine Punkt, der dich davon abhält, einen nächsten Schritt zu machen? Dann können wir genau den klären, statt das komplette Thema noch einmal durchzugehen."],
  ["Kurz nachfassen · nach 3–4 Tagen","Hey [Name], nur kurz nachgefragt, damit’s nicht untergeht: Grundsätzlich interessant, später oder eher nicht dein Ding? Alles drei ist völlig okay 🙂"],
  ["Einwand · „Was ist es denn?“","Ehrlich? Im Chat würde ich’s nur halb erklären und du hättest ein falsches Bild. In 10 Minuten am Telefon siehst du selbst, ob’s was für dich ist. Heute Abend oder morgen?"],
  ["Einwand · „Ist das so ein Schneeballding?“","Gute Frage, die hab ich mir auch gestellt. Lass es dir einfach zeigen und urteile selbst. Ich will dich zu nichts überreden."],
  ["Nach einer Absage","Alles gut, danke für die ehrliche Antwort! Falls dir mal jemand einfällt, für den das passen könnte, sag gern Bescheid."]]

/* Vorlagen: transparent, mit Firmen- und Produktnamen, ohne „Projekt“, ohne vorgetäuschte Meinungsfrage.
   Format: [Titel, du-Text, Gruppe, Sie-Text (optional)] */
scriptsSet:{
 an:{
  0:["Freund / Bekannter · Kundeninteresse","Hey [Name], ich bin neu bei Best Prime und beschäftige mich mit ePOINT. Damit können Kunden bei passenden Angeboten Cashback erhalten. Ich dachte an dich, weil [ehrlicher Bezug]. Soll ich dir kurz zeigen, wie es funktioniert?","cu","Guten Tag [Name], ich bin neu bei Best Prime und beschäftige mich mit ePOINT. Damit können Kunden bei passenden Angeboten Cashback erhalten. Ich dachte an Sie, weil [ehrlicher Bezug]. Darf ich Ihnen kurz zeigen, wie es funktioniert?"],
  1:["Warmer Kontakt · Kundeninteresse (kurz)","Hi [Name], ich bin jetzt bei Best Prime und erkläre ePOINT – ein Cashback-System, bei dem Kunden bei passenden Angeboten einen Teil ihres Einkaufs gutgeschrieben bekommen. Weil du [konkreter Bezug], könnte das für dich passen. Magst du es dir in 10 Minuten anschauen?","cu","Hallo [Name], ich bin jetzt bei Best Prime und erkläre ePOINT – ein Cashback-System, bei dem Kunden bei passenden Angeboten einen Teil ihres Einkaufs gutgeschrieben bekommen. Weil Sie [konkreter Bezug], könnte das für Sie passen. Möchten Sie es sich in 10 Minuten anschauen?"],
  2:["Freund / Bekannter · Partnerinteresse","Hey [Name], ich starte bei Best Prime im Vertrieb für ePOINT. Ich lerne gerade, wie man passende Kunden und Partner gewinnt und welche Tätigkeiten vergütet werden. Weil du [ehrlicher Bezug], könnte das für dich interessant sein. Hast du Lust, mit mir kurz zu prüfen, ob es zu dir passt?","pa"],
  3:["Warmer Kontakt · Partnerinteresse (sachlich)","Hallo [Name], ich habe bei Best Prime als Vertriebspartner für ePOINT angefangen. Ich erkläre Kunden ein Cashback-System; welche Tätigkeiten vergütet werden, regelt ein offizieller Vergütungsplan. Weil du [ehrlicher Bezug], dachte ich an dich. Wollen wir in 15 Minuten gemeinsam schauen, ob das zu dir passt?","pa","Hallo [Name], ich habe bei Best Prime als Vertriebspartner für ePOINT angefangen. Ich erkläre Kunden ein Cashback-System; welche Tätigkeiten vergütet werden, regelt ein offizieller Vergütungsplan. Weil Sie [ehrlicher Bezug], dachte ich an Sie. Wollen wir in 15 Minuten gemeinsam schauen, ob das zu Ihnen passt?"],
  4:["Händler · persönlicher Einstieg","Hallo [Name], ich bin Vertriebspartner bei Best Prime und möchte mit dir prüfen, ob ePOINT zu deinem Geschäft passt. Mich interessiert zuerst, wie du heute Kunden bindest. Darf ich dir den aktuell verfügbaren Händleransatz kurz zeigen und wir schauen gemeinsam, ob er sinnvoll ist?","me","Hallo [Name], ich bin Vertriebspartner bei Best Prime und möchte mit Ihnen prüfen, ob ePOINT zu Ihrem Geschäft passt. Mich interessiert zuerst, wie Sie heute Kunden binden. Darf ich Ihnen den aktuell verfügbaren Händleransatz kurz zeigen und mit Ihnen schauen, ob er sinnvoll ist?"],
  5:["Kalter Kontakt · mit konkretem Bezug","Hallo [Name], ich bin über [konkreter Bezug] auf dich aufmerksam geworden. Ich bin Vertriebspartner bei Best Prime und beschäftige mich mit ePOINT, einem Cashback-System. Wenn du grundsätzlich offen bist, zeige ich dir in 10 Minuten, wie es funktioniert – wenn nicht, ist das völlig okay.","ka","Guten Tag [Name], ich bin über [konkreter Bezug] auf Sie aufmerksam geworden. Ich bin Vertriebspartner bei Best Prime und beschäftige mich mit ePOINT, einem Cashback-System. Wenn Sie grundsätzlich offen sind, zeige ich Ihnen in 10 Minuten, wie es funktioniert – wenn nicht, ist das völlig in Ordnung."],
  6:["Community / Organisation · Passung prüfen","Hallo [Name], du betreust [Community / Organisation], in der Empfehlungen nur funktionieren, wenn sie echten Mehrwert bringen. Ich bin Vertriebspartner bei Best Prime und möchte mit dir prüfen, ob ePOINT für eure Mitglieder sinnvoll wäre – zunächst als kleiner, freiwilliger Pilot. Hättest du Zeit für einen kurzen Austausch?","co","Hallo [Name], Sie betreuen [Community / Organisation], in der Empfehlungen nur funktionieren, wenn sie echten Mehrwert bringen. Ich bin Vertriebspartner bei Best Prime und möchte mit Ihnen prüfen, ob ePOINT für Ihre Mitglieder sinnvoll wäre – zunächst als kleiner, freiwilliger Pilot. Hätten Sie Zeit für einen kurzen Austausch?"],
  7:["Unternehmer / Vertriebskopf","Servus [Name], ich möchte mit dir prüfen, ob ePOINT ein zusätzliches Ertragsfeld für deine Organisation eröffnen kann. Relevant wäre das aus meiner Sicht wegen [konkreter Bezug]. Lass uns Aufwand, Kundennutzen und Vergütung anhand der aktuellen Unterlagen durchgehen. Passt nächste Woche ein kurzer Austausch?","un","Guten Tag [Name], ich möchte mit Ihnen prüfen, ob ePOINT ein zusätzliches Ertragsfeld für Ihre Organisation eröffnen kann. Relevant wäre das aus meiner Sicht wegen [konkreter Bezug]. Lassen Sie uns Aufwand, Kundennutzen und Vergütung anhand der aktuellen Unterlagen durchgehen. Passt Ihnen nächste Woche ein kurzer Austausch?"],
  8:["Alter Kontakt · mit echtem Anlass","Hey [Name], lange nichts gehört! Ich melde mich, weil ich bei Best Prime angefangen habe und mich mit ePOINT beschäftige – einem Cashback-System. Ich musste dabei an dich denken, weil [echter Anlass]. Magst du mal kurz telefonieren?","re"],
  9:["Bekannte · Kunden- oder Partnerseite offen lassen","Hallo [Name], ich bin jetzt bei Best Prime und erkläre ePOINT – ein Cashback-System für Kunden. Für Vertriebspartner gibt es zusätzlich eine vergütete Tätigkeit nach offiziellem Plan. Ich dachte an dich, weil [ehrlicher Bezug]. Interessiert dich eher die Kundenseite oder die Vertriebsseite?","pa","Hallo [Name], ich bin jetzt bei Best Prime und erkläre ePOINT – ein Cashback-System für Kunden. Für Vertriebspartner gibt es zusätzlich eine vergütete Tätigkeit nach offiziellem Plan. Ich dachte an Sie, weil [ehrlicher Bezug]. Interessiert Sie eher die Kundenseite oder die Vertriebsseite?"]
 },

eset","reps":"valid runs (≤ 60 s)","best":"best time","ready":"ready for leader check","short":"Too short – explain the whole system","valid":"{s} s – valid run","long":"{s} s – too long, try again shorter","quizT":"Mini check – without notes","right":"Correct.","wrong":"Not quite – read the three cards above again.","qrule":"<b>Quality rule:</b> prices, compensation, product features and market data only from the current official Best Prime documents or the back office. No old screenshots, no invented figures, no income promises.","unlock":"Leader check","unlockHint":"Explain the system to your leader in 60 seconds – by phone is fine. Once they confirm, you move on to the name list.","leaderOk":"My leader{l} has confirmed my 60-second explanation","unlocked":"Unlocked – on to the name list","locked":"Not unlocked yet","task":"Explain the whole system without reading in a maximum of 60 seconds. Repeat until it works clearly, calmly and without jargon – then leader check."},"plan":{"lead":"You now know why you're starting and how the system works. Here you can see where your path at Best Prime can lead – level by level.","imgL":"The Best Prime compensation plan","alt":"Best Prime compensation plan with all career levels from Partner to Innercircle Board Member","zoom":"View large","zoomHint":"Tip: tapping opens the plan in full size – for zooming.","goalT":"Your why – and your path","goal":"Look at the plan with your goal in mind: which level fits what you want to change? Talk it through with your leader.","yourWhy":"Your why from the start profile","toProfile":"First enter your why in the start profile","soon":"Coming soon","parts":[["How to read the plan","The levels, CP and the key terms – simply explained."],["Scenarios","Examples of how a path can build up level by level."],["Your calculator","Work out for yourself what your goal means in concrete terms."]],"rule":"<b>Important:</b> the compensation plan shows what the system makes possible – no guarantee of a p ed.","crit":[["Trust","How good is your access?"],["Potential","Single contact or multiplier?"],["Pace","How quickly is a conversation possible?"]],"empty":"Collect names first – your list is still empty.","toList":"To the name list","rate":"Rate & select","of":"{n} / 10 TOP contacts","hint":"Give 1–5 points. The list sorts itself by total points. Mark 10 as TOP and of those 5 that you'll contact in the next 24 hours.","cols":["TOP","Name","Trust","Potential","Pace","Σ","First 5"],"quote":["Your TOP 10 are not necessarily your best-known contacts.","They are the ones with the best mix of access, leverage and realistic speed."],"max5":"Maximum 5 – that's the focus","task":"Choose your TOP 10 and mark the first 5 of them that you'll contact within 24 hours."},"sc":{"forWho":"For whom?","manual":"Adjust {ph} manually","copy":"Copy","used":"{n}× confirmed","templates":"Templates","fu":"Follow-ups & objections","vkSeq":"First messages, follow-ups & objections","all":"All","groups":{"fr":"Friends","be":"Acquaintances","wa":"Warm contacts","ka":"Cold contacts","re":"Old contacts","cu":"Customers","pa":"Partners","me":"Merchants","co":"Community","un":"Entrepreneurs"}},"talkto":{"lead":"With warm contacts, trust already exists. Don't use it for pressure – use it for an honest, relevant opening and a small next step.","note":"When copying or opening in WhatsApp, the selected contact is automatically set to “NEW” in the pipeline.","tonT":"Does this sound like you?","ton":"Authenticity is stronger than perfection. Say openly that you're new and what it's about – that builds trust.","rulesT":"Three rules before sending","rules":["Read the template out loud once. If it doesn't sound like you, rewrite it in your own words.","Name an honest, specific connection – why this person in particular?","Say openly what it's about (Best Prime, ePOINT). No hints about income; explain compensation only according to the official plan."],"reT":"Tip for old contacts","re":"Name a genuine reason at counts are activity and requirements according to the plan."},{"q":"What is true about ePAY?","a":["ePAY can already be used everywhere","ePAY is the planned payment solution; what can be used is stated in the current official product status","ePAY replaces ePOINT"],"c":1,"why":"ePAY is planned. Don't promise anything that isn't available yet."}],"right":"Correct.","quizOk":"Self-check passed. Also check whether you can explain the customer benefit in your own words.","quizOpen":"{n} of 4 correct","trT":"Optional: 60-second exercise","trHint":"Explain the example once out loud in your own words – without pressure. This is practice, not a test.","lfbT":"Feedback from your contact person (optional)","lfb":"I showed my explanation to {l} and received feedback","lfbHint":"Helpful, but not a requirement – you can keep learning and planning without approval.","sysTask":"Read the example and pass the self-check. The exercise and your contact person's feedback are optional.","startLead":"Here you decide what you'd like to achieve, at what pace you work and when your first short work block is. This creates your personal recommendation.","changeT":"Your path and your pace","changeBtn":"Change path or pace","changeHint":"You can switch at any time – names, contacts and progress are kept.","profT":"Your start profile","motiveQ":"What specifically should improve through your start? (optional)","motives":[["money","Extra income"],["cust","Customer benefits"],["biz","Benefit for my business"],["team","Team building"]],"motiveFree":"Or in your own words (optional)","timeQ":"How much time can you really schedule next week?","times":[["15","15 minutes"],["30","30 minutes"],["60","60 minutes"],["more","more than 1 hour"]],"blockQ":"When does your first short work block suit you?","skillQ":"What comes easiest to you today?","skills":[["write","Writing"],["phone","Phoning"],["meet","Personal conversations"],["connect","Connecting networks"],["unsure","I'm still unsure"]],"typesT":"Fo ional)":"Personal target before tax (optional)","<div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.05\">Beispiel: 0,05 CP</button><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.10\">Beispiel: 0,10 CP</button></div>":"<div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.05\">Example: 0.05 CP</button><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.10\">Example: 0.10 CP</button></div>","</div><div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCopy\">Berechnung kopieren</button><button class=\"btn sm ghost\" data-act=\"cReset\">Beispiel zurücksetzen</button></div></div>":"</div><div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCopy\">Copy calculation</button><button class=\"btn sm ghost\" data-act=\"cReset\">Reset example</button></div></div>","<p>Du erklärst einen Nutzen und hilfst passenden Menschen beim Einstieg. Ob und wie du dafür Vergütung erhältst, hängt an der Tätigkeit und den geltenden Bedingungen.</p><div class=\"grid2\"><div class=\"card\"><h3>Abschlussprovision</h3><p class=\"small\">Eine einmalige Provision für einen bestimmten qualifizierten Anlass. Was als Abschluss zählt, welche Kosten entstehen und wann ein Anspruch besteht, muss belegt sein.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Nutzungsbezogene Vergütung aus CP im jeweiligen Abrechnungszeitraum. Sie kann bei fortlaufender vergütungsfähiger Nutzung erneut entstehen. Eine Registrierung allein erzeugt keinen festen Monatsverdienst.</p></div></div><p class=\"small muted\">Eigene Kunden, Zusammenarbeit mit Community Buildern und Teamaufbau sind verschiedene Wege. Du musst nicht zuerst ein großes Team aufbauen.</p>":"<p>You explain a benefit and help suitable people get started. Whether and how you are paid for this depends on the activity and the applicable conditions.</p><div class=\"grid2\"><div class=\"card\"><h3>Closing commission</h3><p class=\"small\">A one-off commission for a specific qualifying event. What counts as a closing, which costs arise and when an entitlement exists must be documented.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Usage-based compensation from CP in the respective billing period. It can arise again with ongoing eligible usage. A registration alone does not create a fixed monthly income.</p></div></div><p class=\"small muted\">Own customers, working with Community Builders and team building are different paths. You don't have to build a big team first.</p>","<p><b>CP = Commission Points.</b> CP sind eine Rechengröße für vergütungsfähige Nutzung. Im Beispiel rechnen wir mit aktiven Kunden × angenommenen CP je Kunde. Echte CP ergeben sich aus den offiziellen Abrechnungsregeln.</p><p><b>Airtime = CP × dein berechtigter Rang-Satz.</b></p><div class=\"card hi\"><span class=\"label\">Beispiel Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 aktive Kunden, 10 CP, 20 €/CP. Bei angenommenen 0,05 CP wären es 100 €. Beide CP-Werte sind Modellannahmen; weder ein garantierter Wert noch ein gemessener Durchschnitt.</p></div><p class=\"small muted\">Der TB-Satz setzt die passende Qualifikation voraus. Auch ein kleineres Ziel braucht echte aktive Kunden, passende Voraussetzungen und einen Abrechnungszeitraum.</p>":"<p><b>CP = Commission Points.</b> CP are a calculation unit for eligible usage. In the example we calculate with active customers × assumed CP per customer. Real CP result from the official billing rules.</p><p><b>Airtime = CP × your eligible rank rate.</b></p><div class=\"card hi\"><span class=\"label\">Example Team Builder</span><h3>100 × 0.10 CP × 20 € = 200 €</h3><p class=\"small\">100 active customers, 10 CP, 20 €/CP. With an assumed 0.05 CP it would be 100 €. Both CP values are model assumptions; neither a guaranteed value nor a measured average.</p></div><p class=\"small muted\">The TB rate requires the matching qualification. Even a smaller goal needs real active customers, matching requirements and a billing period.</p>","<p>Im Modell arbeitet ein Team Builder mit einem Community Builder zusammen: TB 20 €/CP, CB 5 €/CP. Die rechnerische Differenz ist 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>CB-Anteil separat: 20 × 5 € = <b>100 €</b>.<br>Rechnerische TB-Differenz: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Fünf vergleichbare CBs: 1.000 aktive Kunden, 100 CP, 1.500 € rechnerische TB-Differenz. Nicht zusätzlich Team Commission auf dieselben CP addieren.</p><p class=\"small muted\">Ein Händler ist nicht automatisch ein CB. Der tatsächliche Händlerprozess und eine gesonderte Händler-Abschlussvergütung müssen aus aktuellen Unterlagen erklärt werden.</p>":"<p>In the model, a Team Builder works with a Community Builder: TB 20 €/CP, CB 5 €/CP. The calculated difference is 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0.10 CP = 20 CP</h3><p>CB share separately: 20 × 5 € = <b>100 €</b>.<br>Calculated TB difference: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Five comparable CBs: 1,000 active customers, 100 CP, 1,500 € calculated TB difference. Do not additionally add team commission on the same CP.</p><p class=\"small muted\">A merchant is not automatically a CB. The actual merchant process and any separate merchant closing compensation must be explained from current documents.</p>","<p><b>Generation = Entfernung in deiner Partnerkette.</b> Jeder direkte Partner ist Generation 1, unabhängig vom Rang. Ein Country Manager kann deshalb 50 Team Builder direkt in Generation 1 haben.</p><div class=\"grid3\">":"<p><b>Generation = distance in your partner chain.</b> Every direct partner is generation 1, regardless of rank. A Country Manager can therefore have 50 Team Builders directly in generation 1.</p><div class=\"grid3\">","<div class=\"card\"><span class=\"label\">Generation ":"<div class=\"card\"><span class=\"label\">Generation ","Dein direkter Partner":"Your direct partner","Partner deines direkten Partners":"Your direct partner's partner","Die nächste Partnerebene":"The next partner level","</div><p class=\"small muted\">Das sind Modellwerte der Team-Airtime. Einmalige Team-Abschlussprovisionen (20 / 6 / 4 € laut Vergütungsgrafik) sind ein anderer Baustein; Anlass und Einheit nicht ungeprüft übernehmen. Für Generation 4 ist hier kein Team-Airtime-Satz hinterlegt.</p>":"</div><p class=\"small muted\">These are model values of team Airtime. One-off team closing commissions (20 / 6 / 4 € according to the compensation chart) are a different component; don't adopt the trigger and unit without checking. No team Airtime rate is stored here for generation 4.</p>","<p>Die vier Beispiele zeigen unterschiedliche Aufbausituationen. Sie sind weder typische Ergebnisse noch automatisch aufeinanderfolgende Karriereschritte.</p><div class=\"grid2 c-presets\">":"<p>The four examples show different build-up situations. They are neither typical results nor automatically consecutive career steps.</p><div class=\"grid2 c-presets\">","100 aktive eigene Kunden, 0,05 CP, TB-Satz 20 €/CP":"100 own active customers, 0.05 CP, TB rate 20 €/CP","5 CBs mit je 200 aktiven Kunden, 0,10 CP, Differenz 15 €/CP":"5 CBs with 200 active customers each, 0.10 CP, difference 15 €/CP","10 direkte TBs mit je 300 aktiven Kunden, 0,10 CP, G1 10 €/CP":"10 direct TBs with 300 active customers each, 0.10 CP, G1 10 €/CP","50 direkte TBs mit je 500 aktiven Kunden, 0,10 CP, G1 10 €/CP":"50 direct TBs with 500 active customers each, 0.10 CP, G1 10 €/CP","</p><small class=\"muted\">Modellwert vor Steuern · im Rechner öffnen</small></button>":"</p><small class=\"muted\">Model value before tax · open in calculator</small></button>","</div><p class=\"small\">Leadership: Rangdifferenz separat 1.500 €. High Performance: Rangdifferenz separat 50.000 €. <b>Keine Gesamtwerte 4.500 € oder 75.000 € bilden</b>, solange Kumulierung und Anspruch nicht bestätigt sind.</p>":"</div><p class=\"small\">Leadership: rank difference separately 1,500 €. High Performance: rank difference separately 50,000 €. <b>Do not form totals of 4,500 € or 75,000 €</b> as long as stacking and entitlement are not confirmed.</p>","<p>Position, Generation und Vergütungsart sind verschieden. Der höhere Rang verändert den eigenen Airtime-Satz; die tatsächliche Partnerkette bestimmt die Generation.</p><div class=\"tablewrap\"><table><thead><tr><th>Position</th><th>Airtime im Modell</th></tr></thead><tbody>":"<p>Position, generation and type of compensation are different things. A higher rank changes your own Airtime rate; the actual partner chain determines the generation.</p><div class=\"tablewrap\"><table><thead><tr><th>Position</th><th>Airtime in the model</th></tr></thead><tbody>","</tbody></table></div><p class=\"small muted\">Qualifikation, Pack-Alternativen, 50-%-/30-%-Regeln und Berechtigung sind separat zu prüfen. Ein höherer Satz in der Rechnung bedeutet nicht, dass du die Position bereits erreicht hast. Zusätzliche Bonusarten werden nicht ungeprüft eingerechnet.</p>":"</tbody></table></div><p class=\"small muted\">Qualification, pack alternatives, 50 %/30 % rules and eligibility must be checked separately. A higher rate in the calculation doesn't mean you have already reached the position. Additional bonus types are not included without checking.</p>","<p>Der IBM-Welttopf betrachtet das gesamte Unternehmen. Im Modell gilt: <b>weltweite Unternehmens-CP × 10 € ÷ berechtigte IBMs</b>.</p><div class=\"card hi\"><h3>50.000 CP × 10 € = 500.000 €</h3><p>1 IBM: 500.000 € · 5 IBMs: 100.000 € je IBM · 10 IBMs: 50.000 € je IBM.</p></div><p class=\"small\">Laut Provisionsvorgabe von Best Prime ist aktuell ein IBM im Modell hinterlegt (Stand 12.10.2026). Stichtag und Berechtigung bleiben zu prüfen. 2.000 eigene Team-CP ändern die Rechnung bei 50.000 weltweiten CP nicht.</p><div class=\"row c-controls\">":"<p>The IBM world pool looks at the whole company. In the model: <b>worldwide company CP × 10 € ÷ eligible IBMs</b>.</p><div class=\"card hi\"><h3>50,000 CP × 10 € = 500,000 €</h3><p>1 IBM: 500,000 € · 5 IBMs: 100,000 € per IBM · 10 IBMs: 50,000 € per IBM.</p></div><p class=\"small\">According to Best Prime's commission specification, one IBM is currently stored in the model (as of 12.10.2026). Cut-off date and eligibility still need to be checked. 2,000 own team CP don't change the calculation with 50,000 worldwide CP.</p><div class=\"row c-controls\">","Grundlagen ":"Basics ","Optionale Vertiefung ":"Optional deep dive ",">Zurück</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"":">Back</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"","Grundlagen gelesen":"Basics read","Vertiefung gelesen":"Deep dive read","Gelesen - weiter":"Read – continue","<p class=\"small muted\">Grundlagen gelesen: ":"<p class=\"small muted\">Basics read: "," / 2. Vertiefungen sind für kleine Einstiegswege freiwillig.</p>":" / 2. Deep dives are optional for small entry paths.</p>","Alle 7 Lernkarten auswählen":"Select all 7 learning cards","Richtig. ":"Correct. ","Verstehe zuerst die Vergütungsart, dann ein kleines Rechenbeispiel. Teamaufbau und große Zahlen kannst du danach freiwillig vertiefen.":"First understand the type of compensation, then a small calculation example. You can then voluntarily go deeper into team building and big numbers.","<div class=\"card hi\"><span class=\"label\">Dein persönliches Ziel</span><p class=\"small\">":"<div class=\"card hi\"><span class=\"label\">Your personal goal</span><p class=\"small\">","Wähle die Tätigkeit, die zu deinem Einstieg passt. Ein Rechenbeispiel hilft dir beim Verständnis; es ersetzt keine bestätigten Vergütungsbedingungen.":"Choose the activity that fits your entry. A calculation example helps you understand; it doesn't replace confirmed compensation conditions.","<div class=\"card c-source\"><p class=\"small muted\">Modellwerte: Provisionsvorgabe von Best Prime, Stand 12.10.2026. Offiziell t. Your task: explain the benefit clearly.","Meine Rolle, Selbstcheck und Übung":"My role, self-check and practice","<p class=\"badge b-ok\">3 von 3 Fragen richtig</p>":"<p class=\"badge b-ok\">3 of 3 questions correct</p>","<span class=\"label\">Frage ":"<span class=\"label\">Question ","Weitere Berechnungen: Team und IBM":"More calculations: team and IBM","Annahmen und Wunschziel ändern":"Change assumptions and target","Drei Wege. Ein einfaches Beispiel zum Einstieg.":"Three ways. One simple example to start.","<div class=\"grid3 simple-ways\"><section class=\"card\"><span class=\"label\">01 · Eigene Kunden</span><h3>Nutzung ermöglichen</h3><p>Aktive Kunden nutzen ePOINT. Vergütungsfähige Nutzung erzeugt CP - die Rechenpunkte für deine Provision.</p></section><section class=\"card\"><span class=\"label\">02 · Partner begleiten</span><h3>Gemeinsam aufbauen</h3><p>Du unterstützt Partner. Je nach berechtigtem Rang kann dir eine Differenzvergütung zustehen.</p></section><section class=\"card\"><span class=\"label\">03 · Team entwickeln</span><h3>Mit dem Team wachsen</h3><p>Zusätzlich gibt es ein Teammodell nach Partnerebenen. Anspruch und Kombination richten sich nach dem gültigen Plan.</p></section></div>":"<div class=\"grid3 simple-ways\"><section class=\"card\"><span class=\"label\">01 · Own customers</span><h3>Enable usage</h3><p>Active customers use ePOINT. Eligible usage generates CP – the calculation points for your commission.</p></section><section class=\"card\"><span class=\"label\">02 · Support partners</span><h3>Build together</h3><p>You support partners. Depending on your eligible rank, you may be entitled to a difference commission.</p></section><section class=\"card\"><span class=\"label\">03 · Develop a team</span><h3>Grow with the team</h3><p>In addition, there is a team model by partner levels. Entitlement and combination follow the valid plan.</p></section></div>","<section class=\"card hi stack\"><h2>Ein Beispiel mit eigenen Kunden</h2><p><b>100 ak t, hängt an der Tätigkeit und den geltenden Bedingungen.</p><div class=\"grid2\"><div class=\"card\"><h3>Abschlussprovision</h3><p class=\"small\">Eine einmalige Provision für einen bestimmten qualifizierten Anlass. Was als Abschluss zählt, welche Kosten entstehen und wann ein Anspruch besteht, muss belegt sein.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Nutzungsbezogene Vergütung aus CP im jeweiligen Abrechnungszeitraum. Sie kann bei fortlaufender vergütungsfähiger Nutzung erneut entstehen. Eine Registrierung allein erzeugt keinen festen Monatsverdienst.</p></div></div><p class=\"small muted\">Eigene Kunden, Zusammenarbeit mit Community Buildern und Teamaufbau sind verschiedene Wege. Du musst nicht zuerst ein großes Team aufbauen.</p>":"<p>Spieghi un vantaggio e aiuti le persone adatte a iniziare. Se e come ricevi un compenso dipende dall'attività e dalle condizioni vigenti.</p><div class=\"grid2\"><div class=\"card\"><h3>Provvigione di chiusura</h3><p class=\"small\">Una provvigione una tantum per un determinato evento qualificato. Cosa conta come chiusura, quali costi nascono e quando esiste un diritto deve essere documentato.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Compenso basato sull'utilizzo dai CP del rispettivo periodo di conteggio. Può nascere di nuovo con un utilizzo remunerabile continuativo. La sola registrazione non genera un guadagno mensile fisso.</p></div></div><p class=\"small muted\">Clienti propri, collaborazione con Community Builder e costruzione del team sono percorsi diversi. Non devi prima costruire un grande team.</p>","<p><b>CP = Commission Points.</b> CP sind eine Rechengröße für vergütungsfähige Nutzung. Im Beispiel rechnen wir mit aktiven Kunden × angenommenen CP je Kunde. Echte CP ergeben sich aus den offiziellen Abrechnungsregeln.</p><p><b>Airtime = CP × dein berechtigter Rang-Satz.</b></p><div class=\"card hi\"><span class=\"label\">Beispiel Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 aktive Kunden, 10 CP, 20 €/CP. Bei angenommenen 0,05 CP wären es 100 €. Beide CP-Werte sind Modellannahmen; weder ein garantierter Wert noch ein gemessener Durchschnitt.</p></div><p class=\"small muted\">Der TB-Satz setzt die passende Qualifikation voraus. Auch ein kleineres Ziel braucht echte aktive Kunden, passende Voraussetzungen und einen Abrechnungszeitraum.</p>":"<p><b>CP = Commission Points.</b> I CP sono un'unità di calcolo per l'utilizzo remunerabile. Nell'esempio calcoliamo clienti attivi × CP ipotizzati per cliente. I CP reali derivano dalle regole ufficiali di conteggio.</p><p><b>Airtime = CP × la tua tariffa di rango spettante.</b></p><div class=\"card hi\"><span class=\"label\">Esempio Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 clienti attivi, 10 CP, 20 €/CP. Con 0,05 CP ipotizzati sarebbero 100 €. Entrambi i valori CP sono ipotesi di modello; né un valore garantito né una media misurata.</p></div><p class=\"small muted\">La tariffa TB presuppone la qualifica corrispondente. Anche un obiettivo più piccolo richiede clienti attivi reali, requisiti adeguati e un periodo di conteggio.</p>","<p>Im Modell arbeitet ein Team Builder mit einem Community Builder zusammen: TB 20 €/CP, CB 5 €/CP. Die rechnerische Differenz ist 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>CB-Anteil separat: 20 × 5 € = <b>100 €</b>.<br>Rechnerische TB-Differenz: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Fünf vergleichbare CBs: 1.000 aktive Kunden, 100 CP, 1.500 € rechnerische TB-Differenz. Nicht zusätzlich Team Commission auf dieselben CP addieren.</p><p class=\"small muted\">Ein Händler ist nicht automatisch ein CB. Der tatsächliche Händlerprozess und eine gesonderte Händler-Abschlussvergütung müssen aus aktuellen Unterlagen erklärt werden.</p>":"<p>Nel modello un Team Builder lavora con un Community Builder: TB 20 €/CP, CB 5 €/CP. La differenza calcolata è 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>Quota CB a parte: 20 × 5 € = <b>100 €</b>.<br>Differenza TB calcolata: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Cinque CB comparabili: 1.000 clienti attivi, 100 CP, 1.500 € di differenza TB calcolata. Non sommare in più la Team Commission sugli stessi CP.</p><p class=\"small muted\">Un commerciante non è automaticamente un CB. Il processo reale per commercianti e un eventuale compenso separato per chiusure con commercianti vanno spiegati dai documenti attuali.</p>","<p><b>Generation = Entfernung in deiner Partnerkette.</b> Jeder direkte Partner ist Generation 1, unabhängig vom Rang. Ein Country Manager kann deshalb 50 Team Builder direkt in Generation 1 haben.</p><div class=\"grid3\">":"<p><b>Generazione = distanza nella tua catena di partner.</b> Ogni partner diretto è generazione 1, indipendentemente dal rango. Un Country Manager può quindi avere 50 Team Builder direttamente in generazione 1.</p><div class=\"grid3\">","<div class=\"card\"><span class=\"label\">Generation ":"<div class=\"card\"><span class=\"label\">Generazione ","Dein direkter Partner":"Il tuo partner diretto","Partner deines direkten Partners":"Il partner del tuo partner diretto","Die nächste Partnerebene":"Il livello di partner successivo","</div><p class=\"small muted\">Das sind Modellwerte der Team-Airtime. Einmalige Team-Abschlussprovisionen (20 / 6 / 4 € laut Vergütungsgrafik) sind ein anderer Baustein; Anlass und Einheit nicht ungeprüft übernehmen. Für Generation 4 ist hier kein Team-Airtime-Satz hinterlegt.</p>":"</div><p class=\"small muted\">Questi sono valori modello dell'Airtime team. Le provvigioni di chiusura team una tantum (20 / 6 / 4 € secondo la grafica) sono un altro elemento; non adottare evento e unità senza verifica. Per la generazione 4 qui non è prevista alcuna tariffa Airtime team.</p>","<p>Die vier Beispiele zeigen unterschiedliche Aufbausituationen. Sie sind weder typische Ergebnisse noch automatisch aufeinanderfolgende Karriereschritte.</p><div class=\"grid2 c-presets\">":"<p>I quattro esempi mostrano diverse situazioni di crescita. Non sono né risultati tipici né passi di carriera automaticamente consecutivi.</p><div class=\"grid2 c-presets\">","100 aktive eigene Kunden, 0,05 CP, TB-Satz 20 €/CP":"100 clienti attivi propri, 0,05 CP, tariffa TB 20 €/CP","5 CBs mit je 200 aktiven Kunden, 0,10 CP, Differenz 15 €/CP":"5 CB con 200 clienti attivi ciascuno, 0,10 CP, differenza 15 €/CP","10 direkte TBs mit je 300 aktiven Kunden, 0,10 CP, G1 10 €/CP":"10 TB diretti con 300 clienti attivi ciascuno, 0,10 CP, G1 10 €/CP","50 direkte TBs mit je 500 aktiven Kunden, 0,10 CP, G1 10 €/CP":"50 TB diretti con 500 clienti attivi ciascuno, 0,10 CP, G1 10 €/CP","</p><small class=\"muted\">Modellwert vor Steuern · im Rechner öffnen</small></button>":"</p><small class=\"muted\">Valore modello al lordo delle imposte · apri nel calcolatore</small></button>","</div><p class=\"small\">Leadership: Rangdifferenz separat 1.500 €. High Performance: Rangdifferenz separat 50.000 €. <b>Keine Gesamtwerte 4.500 € oder 75.000 € bilden</b>, solange Kumulierung und Anspruch nicht bestätigt sind.</p>":"</div><p class=\"small\">Leadership: differenza di rango a parte 1.500 €. High Performance: differenza di rango a parte 50.000 €. <b>Non formare totali di 4.500 € o 75.000 €</b> finché cumulo e diritto non sono confermati.</p>","<p>Position, Generation und Vergütungsart sind verschieden. Der höhere Rang verändert den eigenen Airtime-Satz; die tatsächliche Partnerkette bestimmt die Generation.</p><div class=\"tablewrap\"><table><thead><tr><th>Position</th><th>Airtime im Modell</th></tr></thead><tbody>":"<p>Posizione, generazione e tipo di compenso sono cose diverse. Il rango più alto cambia la propria tariffa Airtime; la catena reale dei partner determina la generazione.</p><div class=\"tablewrap\"><table><thead><tr><th>Posizione</th><th>Airtime nel modello</th></tr></thead><tbody>","</tbody></table></div><p class=\"small muted\">Qualifikation, Pack-Alternativen, 50-%-/30-%-Regeln und Berechtigung sind separat zu prüfen. Ein höherer Satz in der Rechnung bedeutet nicht, dass du die Position bereits erreicht hast. Zusätzliche Bonusarten werden nicht ungeprüft eingerechnet.</p>":"</tbody></table></div><p class=\"small muted\">Qualifica, alternative di pack, regole 50 %/30 % e diritto vanno verificati a parte. Una tariffa più alta nel calcolo non significa che hai già raggiunto la posizione. Altri tipi di bonus non vengono inclusi senza verifica.</p>","<p>Der IBM-Welttopf betrachtet das gesamte Unternehmen. Im Modell gilt: <b>weltweite Unternehmens-CP × 10 € ÷ berechtigte IBMs</b>.</p><div class=\"card hi\"><h3>50.000 CP × 10 € = 500.000 €</h3><p>1 IBM: 500.000 € · 5 IBMs: 100.000 € je IBM · 10 IBMs: 50.000 € je IBM.</p></div><p class=\"small\">Laut Provisionsvorgabe von Best Prime ist aktuell ein IBM im Modell hinterlegt (Stand 12.10.2026). Stichtag und Berechtigung bleiben zu prüfen. 2.000 eigene Team-CP ändern die Rechnung bei 50.000 weltweiten CP nicht.</p><div class=\"row c-controls\">":"<p>Il pool mondiale IBM considera l'intera azienda. Nel modello vale: <b>CP aziendali mondiali × 10 € ÷ IBM aventi diritto</b>.</p><div class=\"card hi\"><h3>50.000 CP × 10 € = 500.000 €</h3><p>1 IBM: 500.000 € · 5 IBM: 100.000 € per IBM · 10 IBM: 50.000 € per IBM.</p></div><p class=\"small\">Secondo le indicazioni provvigionali di Best Prime, attualmente nel modello è previsto un IBM (stato 12.10.2026). Data di riferimento e diritto restano da verificare. 2.000 CP del proprio team non cambiano il calcolo con 50.000 CP mondiali.</p><div class=\"row c-controls\">","Grundlagen ":"Basi ","Optionale Vertiefung ":"Approfondimento facoltativo ",">Zurück</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"":">Indietro</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"","Grundlagen gelesen":"Basi lette","Vertiefung gelesen":"Approfondimento letto","Gelesen - weiter":"Let <button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.10\">Beispiel: 0,10 CP</button></div>":"<div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.05\">Primjer: 0,05 CP</button><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.10\">Primjer: 0,10 CP</button></div>","</div><div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCopy\">Berechnung kopieren</button><button class=\"btn sm ghost\" data-act=\"cReset\">Beispiel zurücksetzen</button></div></div>":"</div><div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCopy\">Kopiraj izračun</button><button class=\"btn sm ghost\" data-act=\"cReset\">Poništi primjer</button></div></div>","<p>Du erklärst einen Nutzen und hilfst passenden Menschen beim Einstieg. Ob und wie du dafür Vergütung erhältst, hängt an der Tätigkeit und den geltenden Bedingungen.</p><div class=\"grid2\"><div class=\"card\"><h3>Abschlussprovision</h3><p class=\"small\">Eine einmalige Provision für einen bestimmten qualifizierten Anlass. Was als Abschluss zählt, welche Kosten entstehen und wann ein Anspruch besteht, muss belegt sein.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Nutzungsbezogene Vergütung aus CP im jeweiligen Abrechnungszeitraum. Sie kann bei fortlaufender vergütungsfähiger Nutzung erneut entstehen. Eine Registrierung allein erzeugt keinen festen Monatsverdienst.</p></div></div><p class=\"small muted\">Eigene Kunden, Zusammenarbeit mit Community Buildern und Teamaufbau sind verschiedene Wege. Du musst nicht zuerst ein großes Team aufbauen.</p>":"<p>Objašnjavaš korist i pomažeš odgovarajućim ljudima da počnu. Hoćeš li i kako za to dobiti nagradu, ovisi o aktivnosti i važećim uvjetima.</p><div class=\"grid2\"><div class=\"card\"><h3>Provizija za zaključak</h3><p class=\"small\">Jednokratna provizija za određeni kvalificirani povod. Što se računa kao zaključak, koji troškovi nastaju i kada postoji pravo, mora biti potkrijepljeno.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Nagrada temeljena na korištenju iz CP-a u pojedinom obračunskom razdoblju. Može ponovno nastati uz kontinuirano korištenje koje se nagrađuje. Sama registracija ne stvara fiksnu mjesečnu zaradu.</p></div></div><p class=\"small muted\">Vlastiti kupci, suradnja s Community Builderima i izgradnja tima različiti su putovi. Ne moraš najprije izgraditi veliki tim.</p>","<p><b>CP = Commission Points.</b> CP sind eine Rechengröße für vergütungsfähige Nutzung. Im Beispiel rechnen wir mit aktiven Kunden × angenommenen CP je Kunde. Echte CP ergeben sich aus den offiziellen Abrechnungsregeln.</p><p><b>Airtime = CP × dein berechtigter Rang-Satz.</b></p><div class=\"card hi\"><span class=\"label\">Beispiel Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 aktive Kunden, 10 CP, 20 €/CP. Bei angenommenen 0,05 CP wären es 100 €. Beide CP-Werte sind Modellannahmen; weder ein garantierter Wert noch ein gemessener Durchschnitt.</p></div><p class=\"small muted\">Der TB-Satz setzt die passende Qualifikation voraus. Auch ein kleineres Ziel braucht echte aktive Kunden, passende Voraussetzungen und einen Abrechnungszeitraum.</p>":"<p><b>CP = Commission Points.</b> CP su obračunska jedinica za korištenje koje se nagrađuje. U primjeru računamo aktivni kupci × pretpostavljeni CP po kupcu. Stvarni CP proizlaze iz službenih pravila obračuna.</p><p><b>Airtime = CP × tvoja stopa ranga na koju imaš pravo.</b></p><div class=\"card hi\"><span class=\"label\">Primjer Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 aktivnih kupaca, 10 CP, 20 €/CP. Uz pretpostavljenih 0,05 CP bilo bi 100 €. Obje CP vrijednosti su pretpostavke modela; nisu ni zajamčena vrijednost ni izmjereni prosjek.</p></div><p class=\"small muted\">TB stopa pretpostavlja odgovarajuću kvalifikaciju. I manji cilj zahtijeva stvarne aktivne kupce, odgovarajuće preduvjete i obračunsko razdoblje.</p>","<p>Im Modell arbeitet ein Team Builder mit einem Community Builder zusammen: TB 20 €/CP, CB 5 €/CP. Die rechnerische Differenz ist 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>CB-Anteil separat: 20 × 5 € = <b>100 €</b>.<br>Rechnerische TB-Differenz: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Fünf vergleichbare CBs: 1.000 aktive Kunden, 100 CP, 1.500 € rechnerische TB-Differenz. Nicht zusätzlich Team Commission auf dieselben CP addieren.</p><p class=\"small muted\">Ein Händler ist nicht automatisch ein CB. Der tatsächliche Händlerprozess und eine gesonderte Händler-Abschlussvergütung müssen aus aktuellen Unterlagen erklärt werden.</p>":"<p>U modelu Team Builder radi s Community Builderom: TB 20 €/CP, CB 5 €/CP. Računska razlika je 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>CB udio zasebno: 20 × 5 € = <b>100 €</b>.<br>Računska TB razlika: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Pet usporedivih CB-ova: 1.000 aktivnih kupaca, 100 CP, 1.500 € računske TB razlike. Ne dodavati još timsku proviziju na iste CP.</p><p class=\"small muted\">Trgovac nije automatski CB. Stvarni proces za trgovce i posebna nagrada za zaključke s trgovcima moraju se objasniti iz aktualne dokumentacije.</p>","<p><b>Generation = Entfernung in deiner Partnerkette.</b> Jeder direkte Partner ist Generation 1, unabhängig vom Rang. Ein Country Manager kann deshalb 50 Team Builder direkt in Generation 1 haben.</p><div class=\"grid3\">":"<p><b>Generacija = udaljenost u tvom lancu partnera.</b> Svaki izravni partner je generacija 1, neovisno o rangu. Country Manager stoga može imati 50 Team Buildera izravno u generaciji 1.</p><div class=\"grid3\">","<div class=\"card\"><span class=\"label\">Generation ":"<div class=\"card\"><span class=\"label\">Generacija ","Dein direkter Partner":"Tvoj izravni partner","Partner deines direkten Partners":"Partner tvog izravnog partnera","Die nächste Partnerebene":"Sljedeća razina partnera","</div><p class=\"small muted\">Das sind Modellwerte der Team-Airtime. Einmalige Team-Abschlussprovisionen (20 / 6 / 4 € laut Vergütungsgrafik) sind ein anderer Baustein; Anlass und Einheit nicht ungeprüft übernehmen. Für Generation 4 ist hier kein Team-Airtime-Satz hinterlegt.</p>":"</div><p class=\"small muted\">To su modelne vrijednosti timskog Airtimea. Jednokratne timske provizije za zaključak (20 / 6 / 4 € prema grafici) drugi su element; povod i jedinicu ne preuzimati bez provjere. Za generaciju 4 ovdje nije pohranjena stopa timskog Airtimea.</p>","<p>Die vier Beispiele zeigen unterschiedliche Aufbausituationen. Sie sind weder typische Ergebnisse noch automatisch aufeinanderfolgende Karriereschritte.</p><div class=\"grid2 c-presets\">":"<p>Četiri primjera pokazuju različite situacije izgradnje. Nisu ni tipični rezultati ni automatski uzastopni koraci karijere.</p><div class=\"grid2 c-presets\">","100 aktive eigene Kunden, 0,05 CP, TB-Satz 20 €/CP":"100 vlastitih aktivnih kupaca, 0,05 CP, TB stopa 20 €/CP","5 CBs mit je 200 aktiven Kunden, 0,10 CP, Differenz 15 €/CP":"5 CB-ova s po 200 aktivnih kupaca, 0,10 CP, razlika 15 €/CP","10 direkte TBs mit je 300 aktiven Kunden, 0,10 CP, G1 10 €/CP":"10 izravnih TB-ova s po 300 aktivnih kupaca, 0,10 CP, G1 10 €/CP","50 direkte TBs mit je 500 aktiven Kunden, 0,10 CP, G1 10 €/CP":"50 izravnih TB-ova s po 500 aktivnih kupaca, 0,10 CP, G1 10 €/CP","</p><small class=\"muted\">Modellwert vor Steuern · im Rechner öffnen</small></button>":"</p><small class=\"muted\">Modelna vrijednost prije poreza · otvori u kalkulatoru</small></button>","</div><p class=\"small\">Leadership: Rangdifferenz separat 1.500 €. High Performance: Rangdifferenz separat 50.000 €. <b>Keine Gesamtwerte 4.500 € oder 75.000 € bilden</b>, solange Kumulierung und Anspruch nicht bestätigt sind.</p>":"</div><p class=\"small\">Leadership: razlika ranga zasebno 1.500 €. High Performance: razlika ranga zasebno 50.000 €. <b>Ne tvoriti ukupne vrijednosti od 4.500 € ili 75.000 €</b> dok kumulacija i pravo nisu potvrđeni.</p>","<p>Position, Generation und Vergütungsart sind verschieden. Der höhere Rang verändert den eigenen Airtime-Satz; die tatsächliche Partnerkette bestimmt die Generation.</p><div class=\"tablewrap\"><table><thead><tr><th>Position</th><th>Airtime im Modell</th></tr></thead><tbody>":"<p>Pozicija, generacija i vrsta nagrade različite su stvari. Viši rang mijenja vlastitu Airtime stopu; stvarni lanac partnera određuje generaciju.</p><div class=\"tablewrap\"><table><thead><tr><th>Pozicija</th><th>Airtime u modelu</th></tr></thead><tbody>","</tbody></table></div><p class=\"small muted\">Qualifikation, Pack-Alternativen, 50-%-/30-%-Regeln und Berechtigung sind separat zu prüfen. Ein höherer Satz in der Rechnung bedeutet nicht, dass du die Position bereits erreicht hast. Zusätzliche Bonusarten werden nicht ungeprüft eingerechnet.</p>":"</tbody></table></div><p class=\"small muted\">Kvalifikaciju, alternative paketa, pravila 50 %/30 % i pravo treba posebno provjeriti. Viša stopa u izračunu ne znači da si već postigao poziciju. Dodatne vrste bonusa ne uračunavaju se bez provjere.</p>","<p>Der IBM-Welttopf betrachtet das gesamte Unternehmen. Im Modell gilt: <b>weltweite Unternehmens-CP × 10 € ÷ berechtigte IBMs</b>.</p><div class=\"card hi\"><h3>50.000 CP × 10 € = 500.000 €</h3><p>1 IBM: 500.000 € · 5 IBMs: 100.000 € je IBM · 10 IBMs: 50.000 € je IBM.</p></div><p class=\"small\">Laut Provisionsvorgabe von Best Prime ist aktuell ein IBM im Modell hinterlegt (Stand 12.10.2026). Stichtag und Berechtigung bleiben zu prüfen. 2.000 eigene Team-CP ändern die Rechnung bei 50.000 weltweiten CP nicht.</p><div class=\"row c-controls\">":"<p>IBM svjetski fond promatra cijelu tvrtku. U modelu vrijedi: <b>svjetski CP tvrtke × 10 € ÷ IBM-ovi s pravom</b>.</p><div class=\"card hi\"><h3>50.000 CP × 10 € = 500.000 €</h3><p>1 IBM: 500.000 € · 5 IBM-ova: 100.000 € po IBM-u · 10 IBM-ova: 50.000 € po IBM-u.</p></div><p class=\"small\">Prema provizijskim smjernicama Best Primea trenutačno je u modelu pohranjen jedan IBM (stanje 12.10.2026). Rok i pravo treba još provjeriti. 2.000 vlastitih timskih CP ne mijenja izračun pri 50.000 svjetskih CP.</p><div class=\"row c-controls\">","Grundlagen ":"Osnove ","Optionale Vertiefung ":"Neobavezno produbljivanje ",">Zurück</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"":">Natrag</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"","Grundlagen gelesen":"Osnove pročitane","Vertiefung gelesen":"Produbljivanje pročitano","Gelesen - weiter":"Pročitano – dalje","<p class=\"small muted\">Grundlagen gelesen: ":"<p class=\"small muted\">Pročitane osnove: "," / 2. Vertiefungen sind für kleine Einstiegswege freiwillig.</p>":" / 2. Produbljivanja su neobavezna za male ulazne putove.</p>","Alle 7 Lernkarten auswählen":"Odaberi svih 7 kartica za učenje","Richtig. ":"Točno. ","Verstehe zuerst die Vergütungsart, dann ein kleines Rechenbeispiel. Teamaufbau und große Zahlen kannst du danach freiwillig vertiefen.":"Najprije razumij vrstu nagrade, zatim mali primjer izračuna. Izgradnju tima i velike brojke zatim možeš dobrovoljno produbiti.","<div class=\"card hi\"><span class=\"label\">Dein persönliches Ziel</span><p class=\"small\">":"<div class=\"card hi\"><span class=\"label\">Tvoj osobni cilj</span><p class=\"small\">","Wähle die Tätigkeit, die zu deinem Einstieg passt. Ein Rechenbeispiel hilft dir beim Verständnis; es ersetzt keine bestätigten Vergütungsbedingungen.":"Odaberi aktivnost koja odgovara tvom početku. Primjer izračuna pomaže ti razumjeti; ne zamjenjuje potvrđene uvjete nagrađivanja.","<div class=\"card c-source\"><p class=\"small muted\">Modellwerte: Provisionsvorgabe von Best Prime, Stand 12.10.2026. Offizielle Kosten, Anspruch und Auszahlung sind separat zu bestätigen. ":"<div class=\"card c-source\"><p class=\"small muted\">Vrijednosti modela: provizijske smjernice Best Primea, stanje 12.10.2026. Službene troškove, pravo i isplatu treba posebno potvrditi. ","Produktangaben sind in der lokal
