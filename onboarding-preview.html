rd stack c-calculator\"><span class=\"label\">Policz sam</span><h2>Twój przykład obliczenia</h2><p class=\"small muted\">Wybrana ranga to założenie przykładowe, a nie stwierdzenie twojego rzeczywistego uprawnienia.</p><div class=\"row c-controls\">","Eigene Kunden":"Własni klienci","CB / Rangdifferenz":"CB / różnica rang","Team":"Zespół","IBM-Welttopf":"Światowa pula IBM","Weltweite Unternehmens-CP":"Światowe CP firmy","Berechtigte IBMs im Beispiel":"Uprawnieni IBM w przykładzie","Eigene Team-CP (zum Vergleich, ändern den Topf nicht)":"Własne CP zespołu (dla porównania, nie zmieniają puli)","Rang für die Rechnung":"Ranga do obliczenia","Oberer Rang im Beispiel":"Wyższa ranga w przykładzie","Unterer Partner im Beispiel":"Niższy partner w przykładzie","Anzahl Partner / CBs":"Liczba partnerów / CB","Eigene aktive Kunden":"Własni aktywni klienci","Aktive Kunden pro Partner":"Aktywni klienci na partnera","Angenommene CP je aktivem Kunden im Monat":"Zakładane CP na aktywnego klienta miesięcznie","<label class=\"field\"><span>Generation (unabhängig vom Rang)</span><select data-calc=\"generation\">":"<label class=\"field\"><span>Generacja (niezależnie od rangi)</span><select data-calc=\"generation\">"," · keine hinterlegte Teamvergütung":" · brak zapisanego wynagrodzenia zespołowego","Persönliches Wunschziel vor Steuern (optional)":"Osobisty cel przed opodatkowaniem (opcjonalnie)","<div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.05\">Beispiel: 0,05 CP</button><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.10\">Beispiel: 0,10 CP</button></div>":"<div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.05\">Przykład: 0,05 CP</button><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.10\">Przykład: 0,10 CP</button></div>","</div><div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCopy\">Berechnung kopieren</button><button class=\"btn sm ghost\" data-act=\"cReset\">Beispiel zurücksetzen</button></div></div>":"</div><div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCopy\">Skopiuj obliczenie</button><button class=\"btn sm ghost\" data-act=\"cReset\">Resetuj przykład</button></div></div>","<p>Du erklärst einen Nutzen und hilfst passenden Menschen beim Einstieg. Ob und wie du dafür Vergütung erhältst, hängt an der Tätigkeit und den geltenden Bedingungen.</p><div class=\"grid2\"><div class=\"card\"><h3>Abschlussprovision</h3><p class=\"small\">Eine einmalige Provision für einen bestimmten qualifizierten Anlass. Was als Abschluss zählt, welche Kosten entstehen und wann ein Anspruch besteht, muss belegt sein.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Nutzungsbezogene Vergütung aus CP im jeweiligen Abrechnungszeitraum. Sie kann bei fortlaufender vergütungsfähiger Nutzung erneut entstehen. Eine Registrierung allein erzeugt keinen festen Monatsverdienst.</p></div></div><p class=\"small muted\">Eigene Kunden, Zusammenarbeit mit Community Buildern und Teamaufbau sind verschiedene Wege. Du musst nicht zuerst ein großes Team aufbauen.</p>":"<p>Wyjaśniasz korzyść i pomagasz odpowiednim osobom zacząć. Czy i jak otrzymasz za to wynagrodzenie, zależy od działalności i obowiązujących warunków.</p><div class=\"grid2\"><div class=\"card\"><h3>Prowizja za zamknięcie</h3><p class=\"small\">Jednorazowa prowizja za określone kwalifikowane zdarzenie. Co liczy się jako zamknięcie, jakie powstają koszty i kiedy istnieje roszczenie, musi być udokumentowane.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Wynagrodzenie zależne od użytkowania z CP w danym okresie rozliczeniowym. Może powstawać ponownie przy ciągłym kwalifikowanym użytkowaniu. Sama rejestracja nie tworzy stałego miesięcznego dochodu.</p></div></div><p class=\"small muted\">Własni klienci, współpraca z Community Builderami i budowa zespołu to różne drogi. Nie musisz najpierw budować dużego zespołu.</p>","<p><b>CP = Commission Points.</b> CP sind eine Rechengröße für vergütungsfähige Nutzung. Im Beispiel rechnen wir mit aktiven Kunden × angenommenen CP je Kunde. Echte CP ergeben sich aus den offiziellen Abrechnungsregeln.</p><p><b>Airtime = CP × dein berechtigter Rang-Satz.</b></p><div class=\"card hi\"><span class=\"label\">Beispiel Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 aktive Kunden, 10 CP, 20 €/CP. Bei angenommenen 0,05 CP wären es 100 €. Beide CP-Werte sind Modellannahmen; weder ein garantierter Wert noch ein gemessener Durchschnitt.</p></div><p class=\"small muted\">Der TB-Satz setzt die passende Qualifikation voraus. Auch ein kleineres Ziel braucht echte aktive Kunden, passende Voraussetzungen und einen Abrechnungszeitraum.</p>":"<p><b>CP = Commission Points.</b> CP to jednostka rozliczeniowa dla kwalifikowanego użytkowania. W przykładzie liczymy aktywni klienci × zakładane CP na klienta. Prawdziwe CP wynikają z oficjalnych zasad rozliczeń.</p><p><b>Airtime = CP × twoja przysługująca stawka rangi.</b></p><div class=\"card hi\"><span class=\"label\">Przykład Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 aktywnych klientów, 10 CP, 20 €/CP. Przy zakładanych 0,05 CP byłoby to 100 €. Obie wartości CP to założenia modelu; ani wartość gwarantowana, ani zmierzona średnia.</p></div><p class=\"small muted\">Stawka TB wymaga odpowiedniej kwalifikacji. Nawet mniejszy cel wymaga prawdziwych aktywnych klientów, odpowiednich warunków i okresu rozliczeniowego.</p>","<p>Im Modell arbeitet ein Team Builder mit einem Community Builder zusammen: TB 20 €/CP, CB 5 €/CP. Die rechnerische Differenz ist 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>CB-Anteil separat: 20 × 5 € = <b>100 €</b>.<br>Rechnerische TB-Differenz: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Fünf vergleichbare CBs: 1.000 aktive Kunden, 100 CP, 1.500 € rechnerische TB-Differenz. Nicht zusätzlich Team Commission auf dieselben CP addieren.</p><p class=\"small muted\">Ein Händler ist nicht automatisch ein CB. Der tatsächliche Händlerprozess und eine gesonderte Händler-Abschlussvergütung müssen aus aktuellen Unterlagen erklärt werden.</p>":"<p>W modelu Team Builder współpracuje z Community Builderem: TB 20 €/CP, CB 5 €/CP. Wyliczona różnica wynosi 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>Udział CB osobno: 20 × 5 € = <b>100 €</b>.<br>Wyliczona różnica TB: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Pięciu porównywalnych CB: 1 000 aktywnych klientów, 100 CP, 1 500 € wyliczonej różnicy TB. Nie dodawać dodatkowo prowizji zespołowej od tych samych CP.</p><p class=\"small muted\">Sprzedawca nie jest automatycznie CB. Rzeczywisty proces dla sprzedawców i ewentualne osobne wynagrodzenie za zamknięcia ze sprzedawcami trzeba wyjaśnić na podstawie aktualnych dokumentów.</p>","<p><b>Generation = Entfernung in deiner Partnerkette.</b> Jeder direkte Partner ist Generation 1, unabhängig vom Rang. Ein Country Manager kann deshalb 50 Team Builder direkt in Generation 1 haben.</p><div class=\"grid3\">":"<p><b>Generacja = odległość w twoim łańcuchu partnerów.</b> Każdy bezpośredni partner to generacja 1, niezależnie od rangi. Country Manager może więc mieć 50 Team Builderów bezpośrednio w generacji 1.</p><div class=\"grid3\">","<div class=\"card\"><span class=\"label\">Generation ":"<div class=\"card\"><span class=\"label\">Generacja ","Dein direkter Partner":"Twój bezpośredni partner","Partner deines direkten Partners":"Partner twojego bezpośredniego partnera","Die nächste Partnerebene":"Następny poziom partnerów","</div><p class=\"small muted\">Das sind Modellwerte der Team-Airtime. Einmalige Team-Abschlussprovisionen (20 / 6 / 4 € laut Vergütungsgrafik) sind ein anderer Baustein; Anlass und Einheit nicht ungeprüft übernehmen. Für Generation 4 ist hier kein Team-Airtime-Satz hinterlegt.</p>":"</div><p class=\"small muted\">To wartości modelowe Airtime zespołowego. Jednorazowe zespołowe prowizje za zamknięcie (20 / 6 / 4 € według grafiki) to inny element; nie przyjmuj zdarzenia i jednostki bez sprawdzenia. Dla generacji 4 nie zapisano tu stawki Airtime zespołowego.</p>","<p>Die vier Beispiele zeigen unterschiedliche Aufbausituationen. Sie sind weder typische Ergebnisse noch automatisch aufeinanderfolgende Karriereschritte.</p><div class=\"grid2 c-presets\">":"<p>Cztery przykłady pokazują różne sytuacje rozwoju. Nie są ani typowymi wynikami, ani automatycznie następującymi po sobie krokami kariery.</p><div class=\"grid2 c-presets\">","100 aktive eigene Kunden, 0,05 CP, TB-Satz 20 €/CP":"100 własnych aktywnych klientów, 0,05 CP, stawka TB 20 €/CP","5 CBs mit je 200 aktiven Kunden, 0,10 CP, Differenz 15 €/CP":"5 CB po 200 aktywnych klientów, 0,10 CP, różnica 15 €/CP","10 direkte TBs mit je 300 aktiven Kunden, 0,10 CP, G1 10 €/CP":"10 bezpośrednich TB po 300 aktywnych klientów, 0,10 CP, G1 10 €/CP","50 direkte TBs mit je 500 aktiven Kunden, 0,10 CP, G1 10 €/CP":"50 bezpośrednich TB po 500 aktywnych klientów, 0,10 CP, G1 10 €/CP","</p><small class=\"muted\">Modellwert vor Steuern · im Rechner öffnen</small></button>":"</p><small class=\"muted\">Wartość modelowa przed opodatkowaniem · otwórz w kalkulatorze</small></button>","</div><p class=\"small\">Leadership: Rangdifferenz separat 1.500 €. High Performance: Rangdifferenz separat 50.000 €. <b>Keine Gesamtwerte 4.500 € oder 75.000 € bilden</b>, solange Kumulierung und Anspruch nicht bestätigt sind.</p>":"</div><p class=\"small\">Leadership: różnica rang osobno 1 500 €. High Performance: różnica rang osobno 50 000 €. <b>Nie sumuj do 4 500 € ani 75 000 €</b>, dopóki kumulacja i roszczenie nie są potwierdzone.</p>","<p>Position, Generation und Vergütungsart sind verschieden. Der höhere Rang verändert den eigenen Airtime-Satz; die tatsächliche Partnerkette bestimmt die Generation.</p><div class=\"tablewrap\"><table><thead><tr><th>Position</th><th>Airtime im Modell</th></tr></thead><tbody>":"<p>Pozycja, generacja i rodzaj wynagrodzenia to różne rzeczy. Wyższa ranga zmienia własną stawkę Airtime; rzeczywisty łańcuch partnerów określa generację.</p><div class=\"tablewrap\"><table><thead><tr><th>Pozycja</th><th>Airtime w modelu</th></tr></thead><tbody>","</tbody></table></div><p class=\"small muted\">Qualifikation, Pack-Alternativen, 50-%-/30-%-Regeln und Berechtigung sind separat zu prüfen. Ein höherer Satz in der Rechnung bedeutet nicht, dass du die Position bereits erreicht hast. Zusätzliche Bonusarten werden nicht ungeprüft eingerechnet.</p>":"</tbody></table></div><p class=\"small muted\">Kwalifikację, alternatywy pakietów, zasady 50 %/30 % i uprawnienie należy sprawdzić osobno. Wyższa stawka w obliczeniu nie oznacza, że już osiągnąłeś pozycję. Dodatkowe rodzaje bonusów nie są uwzględniane bez sprawdzenia.</p>","<p>Der IBM-Welttopf betrachtet das gesamte Unternehmen. Im Modell gilt: <b>weltweite Unternehmens-CP × 10 € ÷ berechtigte IBMs</b>.</p><div class=\"card hi\"><h3>50.000 CP × 10 € = 500.000 €</h3><p>1 IBM: 500.000 € · 5 IBMs: 100.000 € je IBM · 10 IBMs: 50.000 € je IBM.</p></div><p class=\"small\">Laut Provisionsvorgabe von Best Prime ist aktuell ein IBM im Modell hinterlegt (Stand 12.10.2026). Stichtag und Berechtigung bleiben zu prüfen. 2.000 eigene Team-CP ändern die Rechnung bei 50.000 weltweiten CP nicht.</p><div class=\"row c-controls\">":"<p>Światowa pula IBM obejmuje całą firmę. W modelu obowiązuje: <b>światowe CP firmy × 10 € ÷ uprawnieni IBM</b>.</p><div class=\"card hi\"><h3>50 000 CP × 10 € = 500 000 €</h3><p>1 IBM: 500 000 € · 5 IBM: 100 000 € na IBM · 10 IBM: 50 000 € na IBM.</p></div><p class=\"small\">Zgodnie z wytycznymi prowizyjnymi Best Prime w modelu zapisany jest obecnie jeden IBM (stan na 12.10.2026). Dzień graniczny i uprawnienie trzeba jeszcze sprawdzić. 2 000 własnych CP zespołu nie zmienia obliczenia przy 50 000 światowych CP.</p><div class=\"row c-controls\">","Grundlagen ":"Podstawy ","Optionale Vertiefung ":"Opcjonalne pogłębienie ",">Zurück</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"":">Wstecz</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"","Grundlagen gelesen":"Podstawy przeczytane","Vertiefung gelesen":"Pogłębienie przeczytane","Gelesen - weiter":"Przeczytane – dalej","<p class=\"small muted\">Grundlagen gelesen: ":"<p class=\"small muted\">Przeczytane podstawy: "," / 2. Vertiefungen sind für kleine Einstiegswege freiwillig.</p>":" / 2. Pogłębienia są dobrowolne przy małych ścieżkach startowych.</p>","Alle 7 Lernkarten auswählen":"Wybierz wszystkie 7 kart","Richtig. ":"Dobrze. ","Verstehe zuerst die Vergütungsart, dann ein kleines Rechenbeispiel. Teamaufbau und große Zahlen kannst du danach freiwillig vertiefen.":"Najpierw zrozum rodzaj wynagrodzenia, potem mały przykład obliczenia. Budowę zespołu i duże liczby możesz potem dobrowolnie zgłębić.","<div class=\"card hi\"><span class=\"label\">Dein persönliches Ziel</span><p class=\"small\">":"<div class=\"card hi\"><span class=\"label\">Twój osobisty cel</span><p class=\"small\">","Wähle die Tätigkeit, die zu deinem Einstieg passt. Ein Rechenbeispiel hilft dir beim Verständnis; es ersetzt keine bestätigten Vergütungsbedingungen.":"Wybierz działalność, która pasuje do twojego startu. Przykład obliczenia pomaga zrozumieć; nie zastępuje potwierdzonych warunków wynagrodzenia.","<div class=\"card c-source\"><p class=\"small muted\">Modellwerte: Provisionsvorgabe von Best Prime, Stand 12.10.2026. Offizielle Kosten, Anspruch und Auszahlung sind separat zu bestätigen. ":"<div class=\"card c-source\"><p class=\"small muted\">Wartości modelu: wytyczne prowizyjne Best Prime, stan na 12.10.2026. Oficjalne koszty, roszczenie i wypłatę należy potwierdzić osobno. ","Produktangaben sind in der lokalen Quellenliste belegt.":"Informacje o produktach są udokumentowane w lokalnej liście źródeł.","Produktfragen sind noch offen; Lernmodell und fachliche Freigabe sind getrennt.":"Pytania o produkt są jeszcze otwarte; model nauki i merytoryczne zatwierdzenie są rozdzielone.","Rechner: eigene Kunden, CB, Team und IBM":"Kalkulator: własni klienci, CB, zespół i IBM","<section class=\"card stack\"><h2>Prüfe deinen Kern</h2><p class=\"small muted\">Drei Grundlagenfragen; bei Fehlern kannst du direkt erneut antworten.</p>":"<section class=\"card stack\"><h2>Sprawdź podstawy</h2><p class=\"small muted\">Trzy podstawowe pytania; przy błędzie możesz od razu odpowiedzieć ponownie.</p>","<label class=\"field\"><span>In deinen Worten: Wie kann aus aktiver Kundennutzung Vergütung entstehen?</span><textarea rows=\"3\" data-bind=\"commission.ownWords\" placeholder=\"Erkläre den Zusammenhang zwischen Nutzung, CP, Rang-Satz und Bedingungen.\">":"<label class=\"field\"><span>Własnymi słowami: jak z aktywnego użytkowania przez klientów może powstać wynagrodzenie?</span><textarea rows=\"3\" data-bind=\"commission.ownWords\" placeholder=\"Wyjaśnij związek między użytkowaniem, CP, stawką rangi i warunkami.\">","<p class=\"small muted\">Deine Erklärung bleibt auf diesem Gerät. Die App prüft nur, ob du eine kurze Erklärung hinterlegt hast; sie bewertet deren fachliche Richtigkeit nicht automatisch.</p>":"<p class=\"small muted\">Twoje wyjaśnienie zostaje na tym urządzeniu. Aplikacja sprawdza tylko, czy wpisałeś krótkie wyjaśnienie; nie ocenia automatycznie jego merytorycznej poprawności.</p>","> Ich kenne den Unterschied zwischen Abschlussprovision und Airtime und weiß, welche Bedingungen noch offen sind.</label>":"> Znam różnicę między prowizją za zamknięcie a Airtime i wiem, które warunki są jeszcze otwarte.</label>","Grundlagen erledigt. Deine Erklärung kannst du mit deinem Ansprechpartner prüfen.":"Podstawy zrobione. Swoje wyjaśnienie możesz sprawdzić z osobą kontaktową.","Noch offen: beide Grundlagenkarten lesen, drei Fragen richtig beantworten, kurz in eigenen Worten erklären und bestätigen.":"Jeszcze otwarte: przeczytać obie karty podstawowe, poprawnie odpowiedzieć na trzy pytania, krótko wyjaśnić własnymi słowami i potwierdzić.","T ,"IBM-Welttopf":"IBM dünya havuzu","Weltweite Unternehmens-CP":"Dünya genelinde şirket CP","Berechtigte IBMs im Beispiel":"Örnekteki hak sahibi IBM'ler","Eigene Team-CP (zum Vergleich, ändern den Topf nicht)":"Kendi ekip CP'n (karşılaştırma için, havuzu değiştirmez)","Rang für die Rechnung":"Hesap için rütbe","Oberer Rang im Beispiel":"Örnekteki üst rütbe","Unterer Partner im Beispiel":"Örnekteki alt partner","Anzahl Partner / CBs":"Partner / CB sayısı","Eigene aktive Kunden":"Kendi aktif müşteriler","Aktive Kunden pro Partner":"Partner başına aktif müşteri","Angenommene CP je aktivem Kunden im Monat":"Aylık aktif müşteri başına varsayılan CP","<label class=\"field\"><span>Generation (unabhängig vom Rang)</span><select data-calc=\"generation\">":"<label class=\"field\"><span>Kuşak (rütbeden bağımsız)</span><select data-calc=\"generation\">"," · keine hinterlegte Teamvergütung":" · tanımlı ekip kazancı yok","Persönliches Wunschziel vor Steuern (optional)":"Vergi öncesi kişisel hedef (isteğe bağlı)","<div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.05\">Beispiel: 0,05 CP</button><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.10\">Beispiel: 0,10 CP</button></div>":"<div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.05\">Örnek: 0,05 CP</button><button class=\"btn sm\" data-act=\"cCP\" data-v=\"0.10\">Örnek: 0,10 CP</button></div>","</div><div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCopy\">Berechnung kopieren</button><button class=\"btn sm ghost\" data-act=\"cReset\">Beispiel zurücksetzen</button></div></div>":"</div><div class=\"row c-controls\"><button class=\"btn sm\" data-act=\"cCopy\">Hesabı kopyala</button><button class=\"btn sm ghost\" data-act=\"cReset\">Örneği sıfırla</button></div></div>","<p>Du erklärst einen Nutzen und hilfst passenden Menschen beim Einstieg. Ob und wie du dafür Vergütung erhältst, hängt an der Tätigkeit und den geltenden Bedingungen.</p><div class=\"grid2\"><div class=\"card\"><h3>Abschlussprovision</h3><p class=\"small\">Eine einmalige Provision für einen bestimmten qualifizierten Anlass. Was als Abschluss zählt, welche Kosten entstehen und wann ein Anspruch besteht, muss belegt sein.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">Nutzungsbezogene Vergütung aus CP im jeweiligen Abrechnungszeitraum. Sie kann bei fortlaufender vergütungsfähiger Nutzung erneut entstehen. Eine Registrierung allein erzeugt keinen festen Monatsverdienst.</p></div></div><p class=\"small muted\">Eigene Kunden, Zusammenarbeit mit Community Buildern und Teamaufbau sind verschiedene Wege. Du musst nicht zuerst ein großes Team aufbauen.</p>":"<p>Bir faydayı anlatır ve uygun kişilerin başlamasına yardım edersin. Bunun için kazanç alıp almadığın ve nasıl aldığın faaliyete ve geçerli koşullara bağlıdır.</p><div class=\"grid2\"><div class=\"card\"><h3>Kapanış komisyonu</h3><p class=\"small\">Belirli nitelikli bir olay için tek seferlik komisyon. Neyin kapanış sayıldığı, hangi maliyetlerin oluştuğu ve hakkın ne zaman doğduğu belgelenmelidir.</p></div><div class=\"card hi\"><h3>Airtime</h3><p class=\"small\">İlgili hesap dönemindeki CP'den doğan kullanıma dayalı kazanç. Süregelen uygun kullanımda yeniden oluşabilir. Yalnızca kayıt sabit bir aylık gelir yaratmaz.</p></div></div><p class=\"small muted\">Kendi müşterilerin, Community Builder'larla iş birliği ve ekip kurmak farklı yollardır. Önce büyük bir ekip kurmak zorunda değilsin.</p>","<p><b>CP = Commission Points.</b> CP sind eine Rechengröße für vergütungsfähige Nutzung. Im Beispiel rechnen wir mit aktiven Kunden × angenommenen CP je Kunde. Echte CP ergeben sich aus den offiziellen Abrechnungsregeln.</p><p><b>Airtime = CP × dein berechtigter Rang-Satz.</b></p><div class=\"card hi\"><span class=\"label\">Beispiel Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 aktive Kunden, 10 CP, 20 €/CP. Bei angenommenen 0,05 CP wären es 100 €. Beide CP-Werte sind Modellannahmen; weder ein garantierter Wert noch ein gemessener Durchschnitt.</p></div><p class=\"small muted\">Der TB-Satz setzt die passende Qualifikation voraus. Auch ein kleineres Ziel braucht echte aktive Kunden, passende Voraussetzungen und einen Abrechnungszeitraum.</p>":"<p><b>CP = Commission Points.</b> CP, uygun kullanım için bir hesap birimidir. Örnekte aktif müşteri × müşteri başına varsayılan CP ile hesaplıyoruz. Gerçek CP resmi hesaplama kurallarından doğar.</p><p><b>Airtime = CP × hak sahibi olduğun rütbe oranı.</b></p><div class=\"card hi\"><span class=\"label\">Örnek Team Builder</span><h3>100 × 0,10 CP × 20 € = 200 €</h3><p class=\"small\">100 aktif müşteri, 10 CP, 20 €/CP. Varsayılan 0,05 CP ile 100 € olurdu. Her iki CP değeri de model varsayımıdır; ne garantili bir değer ne de ölçülmüş bir ortalamadır.</p></div><p class=\"small muted\">TB oranı uygun niteliği gerektirir. Daha küçük bir hedef bile gerçek aktif müşteriler, uygun koşullar ve bir hesap dönemi gerektirir.</p>","<p>Im Modell arbeitet ein Team Builder mit einem Community Builder zusammen: TB 20 €/CP, CB 5 €/CP. Die rechnerische Differenz ist 15 €/CP.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>CB-Anteil separat: 20 × 5 € = <b>100 €</b>.<br>Rechnerische TB-Differenz: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Fünf vergleichbare CBs: 1.000 aktive Kunden, 100 CP, 1.500 € rechnerische TB-Differenz. Nicht zusätzlich Team Commission auf dieselben CP addieren.</p><p class=\"small muted\">Ein Händler ist nicht automatisch ein CB. Der tatsächliche Händlerprozess und eine gesonderte Händler-Abschlussvergütung müssen aus aktuellen Unterlagen erklärt werden.</p>":"<p>Modelde bir Team Builder bir Community Builder ile çalışır: TB 20 €/CP, CB 5 €/CP. Hesaplanan fark 15 €/CP'dir.</p><div class=\"card hi\"><h3>200 × 0,10 CP = 20 CP</h3><p>CB payı ayrı: 20 × 5 € = <b>100 €</b>.<br>Hesaplanan TB farkı: 20 × 15 € = <b>300 €</b>.</p></div><p class=\"small\">Beş benzer CB: 1.000 aktif müşteri, 100 CP, 1.500 € hesaplanan TB farkı. Aynı CP üzerine ayrıca ekip komisyonu ekleme.</p><p class=\"small muted\">Bir üye işyeri otomatik olarak CB değildir. Gerçek üye işyeri süreci ve ayrı bir üye işyeri kapanış kazancı güncel belgelerden açıklanmalıdır.</p>","<p><b>Generation = Entfernung in deiner Partnerkette.</b> Jeder direkte Partner ist Generation 1, unabhängig vom Rang. Ein Country Manager kann deshalb 50 Team Builder direkt in Generation 1 haben.</p><div class=\"grid3\">":"<p><b>Kuşak = partner zincirindeki uzaklık.</b> Her doğrudan partner rütbeden bağımsız olarak 1. kuşaktır. Bu yüzden bir Country Manager'ın doğrudan 1. kuşakta 50 Team Builder'ı olabilir.</p><div class=\"grid3\">","<div class=\"card\"><span class=\"label\">Generation ":"<div class=\"card\"><span class=\"label\">Kuşak ","Dein direkter Partner":"Doğrudan partnerin","Partner deines direkten Partners":"Doğrudan partnerinin partneri","Die nächste Partnerebene":"Sonraki partner kuşağı","</div><p class=\"small muted\">Das sind Modellwerte der Team-Airtime. Einmalige Team-Abschlussprovisionen (20 / 6 / 4 € laut Vergütungsgrafik) sind ein anderer Baustein; Anlass und Einheit nicht ungeprüft übernehmen. Für Generation 4 ist hier kein Team-Airtime-Satz hinterlegt.</p>":"</div><p class=\"small muted\">Bunlar ekip Airtime'ının model değerleridir. Tek seferlik ekip kapanış komisyonları (grafiğe göre 20 / 6 / 4 €) ayrı bir bileşendir; olay ve birimi kontrol etmeden alma. 4. kuşak için burada ekip Airtime oranı tanımlı değil.</p>","<p>Die vier Beispiele zeigen unterschiedliche Aufbausituationen. Sie sind weder typische Ergebnisse noch automatisch aufeinanderfolgende Karriereschritte.</p><div class=\"grid2 c-presets\">":"<p>Dört örnek farklı gelişim durumlarını gösterir. Ne tipik sonuçlardır ne de otomatik olarak birbirini izleyen kariyer adımlarıdır.</p><div class=\"grid2 c-presets\">","100 aktive eigene Kunden, 0,05 CP, TB-Satz 20 €/CP":"100 kendi aktif müşteri, 0,05 CP, TB oranı 20 €/CP","5 CBs mit je 200 aktiven Kunden, 0,10 CP, Differenz 15 €/CP":"Her biri 200 aktif müşterili 5 CB, 0,10 CP, fark 15 €/CP","10 direkte TBs mit je 300 aktiven Kunden, 0,10 CP, G1 10 €/CP":"Her biri 300 aktif müşterili 10 doğrudan TB, 0,10 CP, G1 10 €/CP","50 direkte TBs mit je 500 aktiven Kunden, 0,10 CP, G1 10 €/CP":"Her biri 500 aktif müşterili 50 doğrudan TB, 0,10 CP, G1 10 €/CP","</p><small class=\"muted\">Modellwert vor Steuern · im Rechner öffnen</small></button>":"</p><small class=\"muted\">Vergi öncesi model değeri · hesaplayıcıda aç</small></button>","</div><p class=\"small\">Leadership: Rangdifferenz separat 1.500 €. High Performance: Rangdifferenz separat 50.000 €. <b>Keine Gesamtwerte 4.500 € oder 75.000 € bilden</b>, solange Kumulierung und Anspruch nicht bestätigt sind.</p>":"</div><p class=\"small\">Leadership: rütbe farkı ayrı 1.500 €. High Performance: rütbe farkı ayrı 50.000 €. <b>Kümülasyon ve hak onaylanmadıkça 4.500 € veya 75.000 € toplamları oluşturma.</b></p>","<p>Position, Generation und Vergütungsart sind verschieden. Der höhere Rang verändert den eigenen Airtime-Satz; die tatsächliche Partnerkette bestimmt die Generation.</p><div class=\"tablewrap\"><table><thead><tr><th>Position</th><th>Airtime im Modell</th></tr></thead><tbody>":"<p>Pozisyon, kuşak ve kazanç türü farklı şeylerdir. Daha yüksek rütbe kendi Airtime oranını değiştirir; kuşağı gerçek partner zinciri belirler.</p><div class=\"tablewrap\"><table><thead><tr><th>Pozisyon</th><th>Modelde Airtime</th></tr></thead><tbody>","</tbody></table></div><p class=\"small muted\">Qualifikation, Pack-Alternativen, 50-%-/30-%-Regeln und Berechtigung sind separat zu prüfen. Ein höherer Satz in der Rechnung bedeutet nicht, dass du die Position bereits erreicht hast. Zusätzliche Bonusarten werden nicht ungeprüft eingerechnet.</p>":"</tbody></table></div><p class=\"small muted\">Nitelik, paket alternatifleri, %50/%30 kuralları ve hak sahipliği ayrıca kontrol edilmelidir. Hesaptaki daha yüksek oran, pozisyona zaten ulaştığın anlamına gelmez. Ek bonus türleri kontrol edilmeden hesaba katılmaz.</p>","<p>Der IBM-Welttopf betrachtet das gesamte Unternehmen. Im Modell gilt: <b>weltweite Unternehmens-CP × 10 € ÷ berechtigte IBMs</b>.</p><div class=\"card hi\"><h3>50.000 CP × 10 € = 500.000 €</h3><p>1 IBM: 500.000 € · 5 IBMs: 100.000 € je IBM · 10 IBMs: 50.000 € je IBM.</p></div><p class=\"small\">Laut Provisionsvorgabe von Best Prime ist aktuell ein IBM im Modell hinterlegt (Stand 12.10.2026). Stichtag und Berechtigung bleiben zu prüfen. 2.000 eigene Team-CP ändern die Rechnung bei 50.000 weltweiten CP nicht.</p><div class=\"row c-controls\">":"<p>IBM dünya havuzu tüm şirkete bakar. Modelde geçerli olan: <b>dünya genelindeki şirket CP × 10 € ÷ hak sahibi IBM'ler</b>.</p><div class=\"card hi\"><h3>50.000 CP × 10 € = 500.000 €</h3><p>1 IBM: 500.000 € · 5 IBM: IBM başına 100.000 € · 10 IBM: IBM başına 50.000 €.</p></div><p class=\"small\">Best Prime'ın komisyon talimatına göre modelde şu an bir IBM tanımlı (12.10.2026 itibarıyla). Kesim tarihi ve hak sahipliği kontrol edilmeli. 50.000 dünya CP'sinde 2.000 kendi ekip CP'si hesabı değiştirmez.</p><div class=\"row c-controls\">","Grundlagen ":"Temeller ","Optionale Vertiefung ":"İsteğe bağlı derinleştirme ",">Zurück</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"":">Geri</button><button class=\"btn gold\" data-act=\"cRead\" data-v=\"","Grundlagen gelesen":"Temeller okundu","Vertiefung gelesen":"Derinleştirme okundu","Gelesen - weiter":"Okundu – devam","<p class=\"small muted\">Grundlagen gelesen: ":"<p class=\"small muted\">Okunan temeller: "," / 2. Vertiefungen sind für kleine Einstiegswege freiwillig.</p>":" / 2. Küçük başlangıç yolları için derinleştirmeler isteğe bağlıdır.</p>","Alle 7 Lernkarten auswählen":"7 öğrenme kartının hepsini seç","Richtig. ":"Doğru. ","Verstehe zuerst die Vergütungsart, dann ein kleines Rechenbeispiel. Teamaufbau und große Zahlen kannst du danach freiwillig vertiefen.":"Önce kazanç türünü, sonra küçük bir hesap örneğini anla. Ekip kurmayı ve büyük rakamları sonra isteğe bağlı derinleştirebilirsin.","<div class=\"card hi\"><span class=\"label\">Dein persönliches Ziel</span><p class=\"small\">":"<div class=\"card hi\"><span class=\"label\">Kişisel hedefin</span><p class=\"small\">","Wähle die Tätigkeit, die zu deinem Einstieg passt. Ein Rechenbeispiel hilft dir beim Verständnis; es ersetzt keine bestätigten Vergütungsbedingungen.":"Başlangıcına uyan faaliyeti seç. Bir hesap örneği anlamana yardım eder; onaylı kazanç koşullarının yerini tutmaz.","<div class=\"card c-source\"><p class=\"small muted\">Modellwerte: Provisionsvorgabe von Best Prime, Stand 12.10.2026. Offizielle Kosten, Anspruch und Auszahlung sind separat zu bestätigen. ":"<div class=\"card c-source\"><p class=\"small muted\">Model değerleri: Best Prime komisyon talimatı, 12.10.2026 itibarıyla. Resmi maliyetler, hak ve ödeme ayrıca onaylanmalıdır. ","Produktangaben sind in der lokalen Quellenliste belegt.":"Ürün bilgileri yerel kaynak listesinde belgelenmiştir.","Produktfragen sind noch offen; Lernmodell und fachliche Freigabe sind getrennt.":"Ürün soruları hâlâ açık; öğrenme modeli ve uzman onayı ayrıdır.","Rechner: eigene Kunden, CB, Team und IBM":"Hesaplayıcı: kendi müşteriler, CB, ekip ve IBM","<section class=\"card stack\"><h2>Prüfe deinen Kern</h2><p class=\"small muted\">Drei Grundlagenfragen; bei Fehlern kannst du direkt erneut antworten.</p>":"<section class=\"card stack\"><h2>Temelini kontrol et</h2><p class=\"small muted\">Üç temel soru; hata yaparsan hemen yeniden cevaplayabilirsin.</p>","<label class=\"field\"><span>In deinen Worten: Wie kann aus aktiver Kundennutzung Vergütung entstehen?</span><textarea rows=\"3\" data-bind=\"commission.ownWords\" placeholder=\"Erkläre den Zusammenhang zwischen Nutzung, CP, Rang-Satz und Bedingungen.\">":"<label class=\"field\"><span>Kendi kelimelerinle: Aktif müşteri kullanımından kazanç nasıl oluşabilir?</span><textarea rows=\"3\" data-bind=\"commission.ownWords\" placeholder=\"Kullanım, CP, rütbe oranı ve koşullar arasındaki bağlantıyı açıkla.\">","<p class=\"small muted\">Deine Erklärung bleibt auf diesem Gerät. Die App prüft nur, ob du eine kurze Erklärung hinterlegt hast; sie bewertet deren fachliche Richtigkeit nicht automatisch.</p>":"<p class=\"small muted\">Açıklaman bu cihazda kalır. Uygulama yalnızca kısa bir açıklama girip girmediğini kontrol eder; içeriğin doğruluğunu otomatik değerlendirmez.</p>","> Ich kenne den Unterschied zwischen Abschlussprovision und Airtime und weiß, welche Bedingungen noch offen sind.</label>":"> Kapanış komisyonu ile Airtime arasındaki farkı biliyorum ve hangi koşulların hâlâ açık olduğunu biliyorum.</label>","Grundlagen erledigt. Deine Erklärung kannst du mit deinem Ansprechpartner prüfen.":"Temeller tamam. Açıklamanı irtibat kişinle kontrol edebilirsin.","Noch offen: beide Grundlagenkarten lesen, drei Fragen richtig beantworten, kurz in eigenen Worten erklären und bestätigen.":"Hâlâ açık: iki temel kartı oku, üç soruyu doğru yanıtla, kısaca kendi kelimelerinle açıkla ve onayla.","Teamwissen prüfen (optional)":"Ekip bilgisini kontrol et (isteğe bağlı)","Offizielle Grafik als Detailansicht":"Resmi grafik ayrıntılı görünüm","<p class=\"small muted\">Die bisherige Grafik ist undatiert. Vor konkreten Vergütungszusagen mit der aktuellen offiziellen Fassung abgleichen.</p><a class=\"planimg\" href=\"img/verguetungsplan.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"img/verguetungsplan.jpg\" alt=\"Best Prime Vergütungsplan\" loading=\"lazy\"></a>":"<p class=\"small muted\">Önceki grafik tarihsizdir. Somut kazanç sözleri vermeden önce güncel resmi sürümle karşılaştır.</p><a class=\"planimg\" href=\"img/verguetungsplan.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"img/verguetungsplan.jpg\" alt=\"Best Prime kazanç planı\" loading=\"lazy\"></a>","Einmalige Abschlussprovision getrennt ansehen":"Tek seferlik kapanış komisyonunu ayrı gör","<div class=\"card stack\"><h3>Dein nächster Schritt</h3><p class=\"small\">":"<div class=\"card stack\"><h3>Sonraki adımın</h3><p class=\"small\">","Gehe zu deiner Namensliste und wähle passende Menschen für erste Gespräche.":"İsim listene git ve ilk görüşmeler için uygun kişileri seç.","Notiere passende Geschäfte. Kläre vor einem konkreten Angebot den aktuellen Händlerprozess.":"Uygun işletmeleri not et. Somut bir tekliften önce güncel üye işyeri sürecini netleştir.","Notiere drei Namen und wähle einen Menschen, für den der tatsächliche Kundennutzen passen könnte.":"Üç isim not et ve gerçek müşteri faydasının uyabileceği bir kişi seç.","</p><button class=\"btn pri\" data-go=\"list\">Zu meinen Namen</button></div>":"</p><button class=\"btn pri\" data-go=\"list\">İsimlerime</button></div>","Bitte erst gültige Werte eingeben.":"Lütfen önce geçerli değerler gir.","Grundlagen erledigt. Deine Erklärung bleibt eine Selbstauskunft.":"Temeller tamam. Açıklaman bir öz değerlendirme olarak kalır.","Beantworte die drei kurzen Fragen und bestätige dein Verständnis.":"Üç kısa soruyu yanıtla ve anladığını onayla.","Start":"Başlangıç","System verstehen":"Sistemi anla","Geld verdienen":"Para kazanmak","Aktiv werden":"Aktif ol","Dein Start":"Başlangıcın","So funktioniert es":"Nasıl çalışır","So verdienst du Geld":"Nasıl para kazanırsın","Hauptbereiche":"Ana bölümler","Alle Aufgaben":"Tüm görevler"," % erledigt":" % tamamlandı","Erledigt":"Tamamlandı","In Bearbeitung":"Devam ediyor","\">Zurück</button>":"\">Geri</button>","\">Weiter: ":"\">İleri: ","Hallo ":"Merhaba ",". Ein Schritt nach dem anderen.":". Adım adım.","<section class=\"card hi stack\"><span class=\"label\">Dein nächster Schritt</span><h2>":"<section class=\"card hi stack\"><span class=\"label\">Sonraki adımın</span><h2>","Verstehe den Nutzen anhand eines einfachen Beispiels.":"Faydayı basit bir örnekle anla.","Lerne die drei Verdienstwege kennen.":"Üç kazanç yolunu tanı.","Notiere passende Menschen für ein erstes Gespräch.":"İlk görüşme için uygun kişileri not et.","Wähle deinen ersten Kontakt.":"İlk kişini seç.","Bereite eine persönliche Nachricht vor.":"Kişisel bir mesaj hazırla.","Setze deine nächste Aufgabe um.":"Sonraki görevini yap.","Arbeitsplan prüfen":"Çalışma planını kontrol et","Jetzt weitermachen":"Şimdi devam et","Fortschritt":"İlerleme"," % erledigt · ":" % tamamlandı · ","Mein Ziel und Arbeitsplan":"Hedefim ve çalışma planım","Ein Einkauf. Ein Kundenvorteil. Deine Aufgabe: den Nutzen verständlich erklären.":"Bir alışveriş. Bir müşteri avantajı. Görevin: faydayı anlaşılır şekilde anlatmak.","Meine Rolle, Selbstcheck und Übung":"Rolüm, öz kontrol ve alıştırma","<p class=\"badge b-ok\">3 von 3 Fragen richtig</p>":"<p class=\"badge b-ok\">3 sorudan 3'ü doğru</p>","<span class=\"label\">Frage ":"<span class=\"label\">Soru ","Weitere Berechnungen: Team und IBM":"Diğer hesaplar: ekip ve IBM","Annahmen und Wunschziel ändern":"Varsayımları ve hedefi değiştir","Drei Wege. Ein einfaches Beispiel zum Einstieg.":"Üç yol. Başlangıç için basit bir örnek.","<div class=\"grid3 simple-ways\"><section class=\"card\"><span class=\"label\">01 · Eigene Kunden</span><h3>Nutzung ermöglichen</h3><p>Aktive Kunden nutzen ePOINT. Vergütungsfähige Nutzung erzeugt CP - die Rechenpunkte für deine Provision.</p></section><section class=\"card\"><span class=\"label\">02 · Partner begleiten</span><h3>Gemeinsam aufbauen</h3><p>Du unterstützt Partner. Je nach berechtigtem Rang kann dir eine Differenzvergütung zustehen.</p></section><section class=\"card\"><span class=\"label\">03 · Team entwickeln</span><h3>Mit dem Team wachsen</h3><p>Zusätzlich gibt es ein Teammodell nach Partnerebenen. Anspruch und Kombination richten sich nach dem gültigen Plan.</p></section></div>":"<div class=\"grid3 simple-ways\"><section class=\"card\"><span class=\"label\">01 · Kendi müşterilerin</span><h3>Kullanımı sağla</h3><p>Aktif müşteriler ePOINT kullanır. Uygun kullanım CP üretir – komisyonun için hesap puanları.</p></section> var VIDEO=String(CFG.videoUrl||"").trim();
function videoSrc(){
  var u=VIDEO, m;

  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-f]{6,}))?/))) return {type:"frame",prov:"Vimeo",src:"https://player.vimeo.com/video/"+m[1]+"?autoplay=1&dnt=1&title=0&byline=0&portrait=0"+(m[2]?"&h="+m[2]:"")+((u.match(/[?&]h=([0-9a-f]+)/)||[])[1]?"&h="+u.match(/[?&]h=([0-9a-f]+)/)[1]:"")};

/* ---------- 60-Sekunden-Timer ---------- */
var pT=null, pStart=0;
function pitchToggle(){ if(pT){ pitchStop(true); } else { pStart=Date.now(); document.getElementById("pitchBtn").textContent=L.m.system.stop; pT=setInterval(tick,200); tick(); } }
function tick(){ var el=document.getElementById("timer"); if(!el){ clearInterval(pT); pT=null; return; } var s=(Date.now()-pStart)/1000, left=Math.ceil(60-s); el.textContent=left>0?left:"+"+Math.floor(s-60); el.className="timer tab "+(left>0?"run":"over"); }
function pitchStop(count){
  if(!pT) return; clearInterval(pT); pT=null;
  var s=Math.round((Date.now()-pStart)/1000), m=L.m.system;
  if(count){
    if(s<15) toast(m.short);
    else if(s<=60){ S.pitch.reps++; if(!S.pitch.best||s<S.pitch.best) S.pitch.best=s; save(); toast(F(m.valid,{s:s})); }
    else toast(F(m.long,{s:s}));
  }
  render();
}

  switch(id){
   case "start": return profOk() && !!S.planAt;
   case "system": return quiz2Ok();
   case "plan": return !!S.plan.ok && commissionComplete();
   case "list": return S.list.length>=Q().names;
   case "top": return topOk();
   case "talkto": return firstIds().length>=Q().sent;
   case "pipe": return pipeOk();
   case "talk": return okTalks().length>=1;
   case "dup": return dupOk();
   case "finish": return !!(S.fin.naSet||S.fin.naDone);
  }
  return false;
};
function partial(id){
  switch(id){
   case "start": return !!(S.path||S.pace||S.prof.time);
   case "system": return Object.keys(S.qz).length>0||S.pitch.reps>0;
   case "plan": return !!S.plan.seen;
   case "list": return S.list.length>0;
   case "top": return first5().length>0||tops().length>0;
   case "talkto": return S.list.some(function(c){ return c.status==="PREP"; })||firstIds().length>0;
   case "pipe": return addressed().length>0;
   case "talk": return S.talks.length>0;
   case "dup": return !!(S.dup.inv||S.dup.partner||S.dup.yes);
   case "finish": return !!(S.fin.naWhat||"").trim();
  }
  return false;
}

 h+=more(tr('Mit eigenen Zahlen rechnen'),cCalculatorHTML(),'commission-calc',!!c.calcOpen);
 h+=more(tr('Abschlussprovision berechnen'),'<div id="commission-closure-box">'+cClosureHTML()+'</div>','commission-closure');
 h+=more(tr('Mehr erfahren: Team, Positionen und IBM'), [2,3,4,5,6].map(function(i){return more(CC.cards[i],cCardHTML(i));}).join('')+more(tr('Teamwissen prüfen (optional)'),cQuizHTML(true)));
 h+=tr('<section class="card stack"><h2>Kurz prüfen, dann weiter</h2>')+cQuizHTML(false)+(commissionQuizOk()?'<label class="opt"><input type="checkbox" data-bind="plan.ok"'+(S.plan.ok?' checked':'')+tr('> Ich verstehe einmalige und nutzungsbezogene Provision. Offene Bedingungen kläre ich vor konkreten Zusagen.</label>'):'')+'<div id="commission-check" class="small">'+(autoDone('plan')?tr('Grundlagen erledigt.'):tr('Beantworte die drei kurzen Fragen.'))+'</div></section>';
 h+=more(tr('Bedingungen und Unterlagen'),cFactsHTML()+more(tr('Bisherige Plangrafik'),tr('<p class="small">Undatierte Grafik: vor Zusagen mit der aktuellen offiziellen Fassung abgleichen.</p><img style="max-width:100%" src="img/verguetungsplan.jpg" alt="Bisheriger Vergütungsplan">'))+more(tr('In eigenen Worten erklären (optional)'),tr('<label class="field"><span>Wie entsteht Vergütung?</span><textarea data-bind="commission.ownWords">')+esc(c.ownWords||'')+'</textarea></label>'));
 return h;
};

};

 var first=doc.querySelector('.script'),grid=first.parentElement;grid.className='stack';

/* Abschlussprovision (Testversion/Vorschau). Wird nach simple.js eingesetzt.
   Quelle: Angabe Michael Weimer, 12.10.2026 (Chat) + Vergütungsgrafik img/verguetungsplan.jpg.
   Regeln:
   - Premium-Paket = 3 CP (gültig ab 15.09.2026), Gutschein/Voucher = 1 CP; beides kann ein Partner erwerben.
   - Wer selbst einschreibt: Abschluss-Satz seines Rangs × CP (CC.closureRates).
   - Darüber: liegt der eigene Satz über dem der ersten Linie → nur die Differenz × CP.
   - Hat der direkte Partner dieselbe Stufe → keine Differenz, dafür Team-Abschlussprovision nach Generation.
   - Team-Abschluss je CP laut Grafik: CB nur Gen. 1 = 20 €, ab TB 20 / 6 / 4 €. Einheit "je CP" = Annahme, siehe CL.teamUnit.
   Offen (nicht bestätigt): Kosten, Qualifikation/50-%-/30-%-Regel, Anspruch und Auszahlung. */
var CL={source:tr("Angabe Michael Weimer, 12.10.2026 · Vergütungsgrafik"),validFrom:"15.09.2026",teamUnit:tr("je CP"),
 packages:[{id:"premium",name:tr("Premium-Paket"),cp:3},{id:"voucher",name:tr("Gutschein / Voucher"),cp:1}],
 team:{P:[0,0,0],CB:[20,0,0],TB:[20,6,4],AM:[20,6,4],RD:[20,6,4],SD:[20,6,4],CM:[20,6,4],IBM:[20,6,4]}};
function clState(){var c=S.commission;if(!c.cl||typeof c.cl!=='object')c.cl={};var s=c.cl;
 if(!s.pkg)s.pkg='premium';if(!s.me)s.me='TB';if(!s.who)s.who='self';if(!s.partner)s.partner='TB';if(s.n==null||s.n==='')s.n=1;return s;}
function clPkg(id){return CL.packages.filter(function(p){return p.id===id;})[0]||CL.packages[0];}
function clIdx(id){for(var i=0;i<CC.ranks.length;i++)if(CC.ranks[i].id===id)return i;return 0;}
/* Ergebnis je Paket: {eur, kind, why} */
function clCalc(me,who,partner,cp){
 var rm=CC.closureRates[me]||0;
 if(who==='self')return {eur:rm*cp,kind:tr('Direktprovision'),why:cp+' CP × '+rm+' €'};
 var g=who==='g1'?1:who==='g2'?2:3;
 if(g===1&&partner!==me){
  var rp=CC.closureRates[partner]||0;
  if(rm>rp)return {eur:(rm-rp)*cp,kind:tr('Differenzprovision'),why:cp+' CP × ('+rm+' € − '+rp+' €)'};
  return {eur:0,kind:'keine',why:tr('Dein direkter Partner hat einen höheren Abschluss-Satz als du – keine Differenz.')};
 }
 var t=(CL.team[me]||[0,0,0])[g-1]||0;
 if(!t)return {eur:0,kind:'keine',why:me==='CB'?tr('Als Community Builder gibt es Team-Abschluss nur in Generation 1.'):tr('Für deinen Rang ist keine Team-Abschlussprovision hinterlegt.')};
 return {eur:t*cp,kind:tr('Team-Abschlussprovision Gen. ')+g,why:cp+' CP × '+t+tr(' € (gleiche Stufe)')};
}
function clCount(){var n=cNum(clState().n,true,10000);return n==null?null:n;}
cClosureResult=function(){
 var s=clState(),p=clPkg(s.pkg),n=clCount();
 if(n==null||n<1)return tr('<p class="small muted">Gib eine Anzahl von mindestens 1 ein.</p>');
 var r=clCalc(s.me,s.who,s.partner,p.cp);
 if(!r.eur)return '<p><b>0,00 €</b></p><p class="small">'+r.why+'</p>';
 return '<p><b>'+n+' × '+p.name+' → '+r.kind+': '+(n>1?n+' × ':'')+r.why+' = '+cMoney(n*r.eur)+tr('</b></p><p class="small muted">Einmalig je Paket, keine Airtime und kein Monatseinkommen. Keine Einkommensgarantie – verbindlich sind die offiziellen Unterlagen.</p>');
};
function clDepth(){
 var s=clState(),p=clPkg(s.pkg),me=s.me,mi=clIdx(me),rows=[];
 rows.push([tr('Du schreibst selbst ein'),clCalc(me,'self','',p.cp)]);
 for(var i=0;i<mi;i++){var r=CC.ranks[i];rows.push([tr('Direkter Partner ist ')+r.id,clCalc(me,'g1',r.id,p.cp)]);}
 [1,2,3].forEach(function(g){rows.push([tr('Partner auf gleicher Stufe (')+me+'), Generation '+g,clCalc(me,'g'+g,me,p.cp)]);});
 return tr('<div class="card stack"><h3>Was du als ')+me+tr(' je ')+p.name+' ('+p.cp+tr(' CP) erhältst</h3><table class="pick"><tbody>')+rows.map(function(x){return '<tr><td>'+x[0]+'</td><td><b>'+cMoney(x[1].eur)+'</b><br><span class="small muted">'+x[1].kind+'</span></td></tr>';}).join('')+'</tbody></table></div>';
}
function clChain(){
 var cp=clPkg(clState().pkg).cp,tb=CC.closureRates.TB,am=CC.closureRates.AM,rd=CC.closureRates.RD;
 return tr('<div class="card hi stack"><h3>Beispiel: Wer bekommt was?</h3><p class="small">Ein Team Builder schreibt einen neuen Partner mit ')+clPkg(clState().pkg).name+' ('+cp+tr(' CP) ein. Darüber stehen ein Area Manager und ein Regional Director.</p><p class="small">TB: ')+cp+' × '+tb+' € = <b>'+cMoney(cp*tb)+'</b><br>AM: '+cp+' × ('+am+' − '+tb+') € = <b>'+cMoney(cp*(am-tb))+tr('</b> Differenz<br>RD: ')+cp+' × ('+rd+' − '+am+') € = <b>'+cMoney(cp*(rd-am))+tr('</b> Differenz</p><p class="small muted">Jeder bekommt nur den Unterschied zu dem Satz, der darunter schon bezahlt ist. Steht über dir ein Partner auf gleicher Stufe, greift statt der Differenz die Team-Abschlussprovision.</p></div>');
}
function clSel(key,opts,val){return '<select data-cl="'+key+'">'+opts.map(function(o){return '<option value="'+o[0]+'"'+(String(val)===o[0]?' selected':'')+'>'+o[1]+'</option>';}).join('')+'</select>';}
cClosureHTML=function(){
 var s=clState(),ranks=CC.ranks.map(function(r){return [r.id,r.id+' · '+r.name+' · '+CC.closureRates[r.id]+' €/CP'];});
 var h=tr('<p class="small">Wenn ein neuer Partner ein Paket erwirbt, gibt es <b>einmalig</b> Abschlussprovision je Commission Point (CP). ')+CL.packages.map(function(p){return p.name+' = <b>'+p.cp+' CP</b>';}).join(', ')+tr(' (gültig ab ')+CL.validFrom+').</p>';
 h+=tr('<div class="grid2"><label class="field"><span>Paket</span>')+clSel('pkg',CL.packages.map(function(p){return [p.id,p.name+' ('+p.cp+' CP)'];}),s.pkg)+'</label>';
 h+=tr('<label class="field"><span>Anzahl Pakete</span><input type="number" min="1" step="1" data-cl="n" value="')+esc(String(s.n))+'"></label>';
 h+=tr('<label class="field"><span>Dein Rang</span>')+clSel('me',ranks,s.me)+'</label>';
 h+=tr('<label class="field"><span>Wer schreibt ein?</span>')+clSel('who',[['self',tr('Ich selbst')],['g1',tr('Mein direkter Partner (1. Linie)')],['g2',tr('Partner in Generation 2 (gleiche Stufe)')],['g3',tr('Partner in Generation 3 (gleiche Stufe)')]],s.who)+'</label>';
 if(s.who==='g1')h+=tr('<label class="field"><span>Rang deines direkten Partners</span>')+clSel('partner',ranks,s.partner)+'</label>';
 h+='</div><div id="commission-closure-results" aria-live="polite">'+cClosureResult()+'</div>';
 h+='<div id="commission-closure-depth">'+clDepth()+'</div>'+clChain();
 h+=tr('<p class="small muted">Quelle: ')+CL.source+'. Team-Abschlussprovision '+CL.teamUnit+tr(' laut Grafik. Noch nicht bestätigt: Kosten, Qualifikation (50-%-/30-%-Regel), Anspruch und Auszahlung. Keine Einkommensgarantie – verbindlich sind die offiziellen Unterlagen.</p>');
 return h;
};
function clRefresh(full){
 var box=document.getElementById('commission-closure-box');
 if(full&&box){box.innerHTML=cClosureHTML();return;}
 var out=document.getElementById('commission-closure-results');if(out)out.innerHTML=cClosureResult();
 var d=document.getElementById('commission-closure-depth');if(d)d.innerHTML=clDepth();
}
document.addEventListener('input',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-cl');if(k!=='n')return;clState().n=e.target.value;save();clRefresh(false);});
document.addEventListener('change',function(e){var k=e.target.getAttribute&&e.target.getAttribute('data-cl');if(!k||k==='n')return;clState()[k]=e.target.value;save();clRefresh(k==='who'||k==='pkg');});

}

load();

render();

})();
